name: build-windows

on:
  push:
    branches:
      - worldgen-perf-fix
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    name: Export Windows x64 (Godot .NET + ReadyToRun)
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust for the patched Windows WebView extension
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Godot 4.7.2 .NET and Windows export templates
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "4.7.2-stable"
          $root = Join-Path $env:RUNNER_TEMP "asteria-godot"
          New-Item -ItemType Directory -Force $root | Out-Null

          $editorZip = Join-Path $root "godot-mono-win64.zip"
          $editorUrl = "https://github.com/godotengine/godot/releases/download/$version/Godot_v$($version)_mono_win64.zip"
          Invoke-WebRequest -Uri $editorUrl -OutFile $editorZip
          $editorHash = (Get-FileHash $editorZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($editorHash -ne "a2a48473a7414c5f19fab690518caebb738c09ef9601f6bd2388676a7f53b3c0") {
            throw "Godot editor archive SHA-256 mismatch: $editorHash"
          }

          $editorDir = Join-Path $root "editor"
          Expand-Archive -Path $editorZip -DestinationPath $editorDir -Force
          $godot = Get-ChildItem $editorDir -Recurse -File |
            Where-Object { $_.Name -eq "Godot_v4.7.2-stable_mono_win64_console.exe" } |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $godot) {
            throw "Godot 4.7.2 .NET console editor executable was not found."
          }

          $templatesZip = Join-Path $root "godot-mono-templates.tpz"
          $templatesUrl = "https://github.com/godotengine/godot/releases/download/$version/Godot_v$($version)_mono_export_templates.tpz"
          Invoke-WebRequest -Uri $templatesUrl -OutFile $templatesZip
          $templatesHash = (Get-FileHash $templatesZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($templatesHash -ne "92f8681e349ef1f90891b792da95e3b2b0bd1ed610b78018c58feb2d87e15a9d") {
            throw "Godot export templates SHA-256 mismatch: $templatesHash"
          }

          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($templatesZip)
          try {
            $versionEntry = $archive.Entries |
              Where-Object { $_.Name -eq "version.txt" } |
              Select-Object -First 1
            $templateVersion = "4.7.2.stable.mono"
            if ($versionEntry) {
              $reader = [System.IO.StreamReader]::new($versionEntry.Open())
              try { $archiveVersion = $reader.ReadToEnd().Trim() } finally { $reader.Dispose() }
              if ($archiveVersion -ne $templateVersion) {
                throw "Unexpected Godot template version: $archiveVersion"
              }
            }
            Write-Host "Installing Godot export templates for $templateVersion"

            $templateDir = Join-Path $env:APPDATA "Godot/export_templates/$templateVersion"
            New-Item -ItemType Directory -Force $templateDir | Out-Null
            $requiredTemplates = @(
              "windows_debug_x86_64.exe",
              "windows_debug_x86_64_console.exe",
              "windows_release_x86_64.exe",
              "windows_release_x86_64_console.exe"
            )
            foreach ($name in $requiredTemplates) {
              $entry = $archive.Entries |
                Where-Object { $_.Name -eq $name } |
                Select-Object -First 1
              if (-not $entry) { throw "Missing export template in archive: $name" }
              $destination = Join-Path $templateDir $name
              [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $destination, $true)
            }
          }
          finally {
            $archive.Dispose()
          }

          & $godot --headless --version
          if ($LASTEXITCODE -ne 0) { throw "Godot version check failed." }
          "GODOT_BIN=$godot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Godot WRY and build WebUI
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE/scripts/install-webui.ps1"
          if ($LASTEXITCODE -ne 0) { throw "WebUI setup failed." }

      - name: Build Godot WRY with explicit Fixed Version runtime selection
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE/scripts/build-godot-wry-windows.ps1"
          if ($LASTEXITCODE -ne 0) { throw "Patched Windows WebView extension build failed." }

      - name: Verify WebUI export inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dist = Join-Path $env:GITHUB_WORKSPACE "ui/dist"
          $index = Join-Path $dist "index.html"
          $manifest = Join-Path $dist "source-manifest.txt"

          foreach ($required in @($index, $manifest)) {
            if (-not (Test-Path $required -PathType Leaf)) {
              throw "Required WebUI export input is missing: $required"
            }
          }

          $assets = @(Get-ChildItem -LiteralPath $dist -File -Recurse |
            Where-Object { $_.Extension -in @(".js", ".css") })
          if ($assets.Count -lt 2) {
            throw "WebUI build did not produce its JavaScript and CSS bundles."
          }

          $logo = Join-Path $dist "branding/asteria_logo.svg"
          if (-not (Test-Path $logo -PathType Leaf)) {
            throw "Pack-owned Asteria logo was not copied into the WebUI bundle: $logo"
          }

          $fonts = @(Get-ChildItem -LiteralPath $dist -Filter "*.woff2" -File -Recurse)
          if ($fonts.Count -lt 1) {
            throw "The WebUI bundle does not contain its Winky Rough WOFF2 font files."
          }
          foreach ($font in $fonts) {
            $stream = [System.IO.File]::OpenRead($font.FullName)
            try {
              $signature = New-Object byte[] 4
              $read = $stream.Read($signature, 0, 4)
              if ($read -ne 4 -or [System.Text.Encoding]::ASCII.GetString($signature) -ne "wOF2") {
                throw "Invalid WOFF2 font asset: $($font.FullName)"
              }
            }
            finally {
              $stream.Dispose()
            }
          }

          Write-Host "WebUI export input: $index"
          Write-Host "WebUI export input: $manifest"
          Write-Host "Verified $($assets.Count) JS/CSS assets, $($fonts.Count) raw WOFF2 fonts, and the Asteria logo."

      - name: Prepare shared Windows export preset
        shell: pwsh
        run: |
          Copy-Item `
            "$env:GITHUB_WORKSPACE/scripts/export-presets/windows-desktop.cfg" `
            "$env:GITHUB_WORKSPACE/export_presets.cfg" `
            -Force

      - name: Restore and build C# solution
        shell: pwsh
        run: |
          dotnet restore .\Asteria.sln
          if ($LASTEXITCODE -ne 0) { throw "dotnet restore failed." }

          dotnet build .\Asteria.sln --configuration ExportRelease --no-restore --nologo
          if ($LASTEXITCODE -ne 0) { throw "C# solution build failed." }

      - name: Import Godot resources and build editor solution
        shell: pwsh
        run: |
          $importOutput = & "$env:GODOT_BIN" --headless --path "$env:GITHUB_WORKSPACE" --editor --import --quit 2>&1
          $importExitCode = $LASTEXITCODE
          $importText = $importOutput -join "`n"
          $importOutput | ForEach-Object { Write-Host $_ }
          if ($importExitCode -ne 0) { throw "Godot resource import failed (exit code $importExitCode)." }
          if ($importText -match '(?im)SCRIPT ERROR:|Parse Error:|Failed to load script') {
            throw "Godot resource import reported a GDScript parse or script-load error."
          }

          $buildOutput = & "$env:GODOT_BIN" --headless --path "$env:GITHUB_WORKSPACE" --editor --build-solutions --quit 2>&1
          $buildExitCode = $LASTEXITCODE
          $buildText = $buildOutput -join "`n"
          $buildOutput | ForEach-Object { Write-Host $_ }
          if ($buildExitCode -ne 0) { throw "Godot C# solution build failed (exit code $buildExitCode)." }
          if ($buildText -match '(?im)SCRIPT ERROR:|Parse Error:|Failed to load script') {
            throw "Godot editor build reported a GDScript parse or script-load error."
          }

      - name: Export Windows x64 Release
        shell: pwsh
        run: |
          $output = Join-Path $env:GITHUB_WORKSPACE "build/Asteria.exe"
          New-Item -ItemType Directory -Force (Split-Path $output) | Out-Null

          & "$env:GODOT_BIN" --headless --path "$env:GITHUB_WORKSPACE" `
            --export-release "Windows Desktop" $output
          if ($LASTEXITCODE -ne 0) { throw "Godot Windows export failed." }
          if (-not (Test-Path $output -PathType Leaf)) {
            throw "Export command succeeded but build/Asteria.exe was not created."
          }

          $runtimePath = Join-Path (Split-Path $output) "WebView2Runtime"
          & "$env:GITHUB_WORKSPACE/scripts/install-webview2-fixed.ps1" -DestinationPath $runtimePath
          if ($LASTEXITCODE -ne 0) { throw "WebView2 Fixed Version packaging failed." }

          $runtimeVersion = (Get-Content (Join-Path $runtimePath "asteria-runtime-version.txt") -Raw).Trim()
          $buildInfo = @(
            "Asteria Windows x64 Release",
            "Commit: $env:GITHUB_SHA",
            "Godot: 4.7.2.stable.mono",
            "Target: win-x64",
            "ReadyToRun: enabled by Asteria.csproj",
            "WebView2 Fixed Version: $runtimeVersion",
            "Built: $([DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ'))"
          )
          $buildInfo | Set-Content (Join-Path (Split-Path $output) "BUILD_INFO.txt") -Encoding utf8

          $package = Join-Path $env:GITHUB_WORKSPACE "build/Asteria-Windows-x64.zip"
          Compress-Archive -Path (Join-Path (Split-Path $output) "*") -DestinationPath $package -CompressionLevel Optimal -Force
          if (-not (Test-Path $package -PathType Leaf)) {
            throw "Windows build archive was not created."
          }

      - name: Verify embedded built-in pack resources
        shell: pwsh
        run: |
          $assemblyPath = Join-Path $env:GITHUB_WORKSPACE "build/data_Asteria_windows_x86_64/Asteria.dll"
          if (-not (Test-Path $assemblyPath -PathType Leaf)) {
            throw "Exported managed assembly not found: $assemblyPath"
          }

          $runtimeRoot = Join-Path $env:GITHUB_WORKSPACE "build/WebView2Runtime"
          $runtimeBrowser = Join-Path $runtimeRoot "msedgewebview2.exe"
          $runtimeVersionFile = Join-Path $runtimeRoot "asteria-runtime-version.txt"
          if (-not (Test-Path $runtimeBrowser -PathType Leaf) -or
              -not (Test-Path $runtimeVersionFile -PathType Leaf)) {
            throw "Self-contained WebView2 Fixed Version runtime is missing from the Windows package."
          }
          $runtimeVersion = (Get-Content $runtimeVersionFile -Raw).Trim()
          if ($runtimeVersion -ne "157.0.4341.42") {
            throw "Unexpected WebView2 Fixed Version in package: $runtimeVersion"
          }
          Write-Host "Verified bundled WebView2 Fixed Version runtime: $runtimeVersion"

          $assembly = [System.Reflection.Assembly]::LoadFrom($assemblyPath)
          $resourcesByCanonicalName = @{}
          foreach ($manifestName in $assembly.GetManifestResourceNames()) {
            $canonicalName = $manifestName.Replace('\', '/')
            if ($resourcesByCanonicalName.ContainsKey($canonicalName)) {
              throw "Duplicate built-in resource after path normalization: $canonicalName"
            }
            $resourcesByCanonicalName[$canonicalName] = $manifestName
          }

          $required = @(
            "asteria.pack.default/ui/theme.json",
            "asteria.pack.default/data/blocks/stone.json",
            "asteria.pack.default/resources/textures/blocks/basalt.png"
          )
          foreach ($resource in $required) {
            if (-not $resourcesByCanonicalName.ContainsKey($resource)) {
              throw "Exported Asteria.dll is missing required built-in pack resource: $resource"
            }

            $manifestName = $resourcesByCanonicalName[$resource]
            $stream = $assembly.GetManifestResourceStream($manifestName)
            if ($null -eq $stream) {
              throw "Could not open exported built-in pack resource: $resource ($manifestName)"
            }

            try {
              if ($resource.EndsWith(".png", [StringComparison]::OrdinalIgnoreCase)) {
                $signature = New-Object byte[] 8
                $read = $stream.Read($signature, 0, $signature.Length)
                $expected = [byte[]](137, 80, 78, 71, 13, 10, 26, 10)
                if ($read -ne 8 -or
                    -not [System.Linq.Enumerable]::SequenceEqual([byte[]]$signature, $expected)) {
                  throw "Embedded texture is not a valid PNG resource: $resource"
                }
              }
            }
            finally {
              $stream.Dispose()
            }

            Write-Host "Verified readable embedded resource: $resource"
          }

      - name: Smoke-test exported WebView2 interface
        shell: pwsh
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = "Stop"
          $executable = Join-Path $env:GITHUB_WORKSPACE "build/Asteria.exe"
          $workingDirectory = Split-Path $executable
          $startedAt = Get-Date
          $logDirectories = @(
            (Join-Path $workingDirectory "logs"),
            (Join-Path $env:APPDATA "Godot/app_userdata/Asteria/logs")
          )
          $webUiLog = Join-Path $env:APPDATA "Godot/app_userdata/Asteria/logs/webui-startup.log"
          $stdoutPath = Join-Path $workingDirectory "smoke-stdout.log"
          $stderrPath = Join-Path $workingDirectory "smoke-stderr.log"

          # Select Fixed Version before WebView2 initializes.
          $runtimeDirectory = Join-Path $workingDirectory "WebView2Runtime"
          $runtimeExecutable = Join-Path $runtimeDirectory "msedgewebview2.exe"
          if (-not (Test-Path $runtimeExecutable -PathType Leaf)) {
            throw "Packaged WebView2 runtime executable is missing: $runtimeExecutable"
          }
          $env:WEBVIEW2_BROWSER_EXECUTABLE_FOLDER = $runtimeDirectory

          Write-Host "Launching exported Windows app; waiting for React, Winky Rough, and the logo..."
          $process = Start-Process -FilePath $executable -WorkingDirectory $workingDirectory -PassThru -RedirectStandardOutput $stdoutPath -RedirectStandardError $stderrPath
          $uiReady = $false
          $assetsReady = $false
          $lastLog = $null

          try {
            $deadline = (Get-Date).AddSeconds(45)
            while ((Get-Date) -lt $deadline) {
              if ($process.HasExited) {
                throw "Asteria exited before WebUI readiness (exit code $($process.ExitCode))."
              }

              $logFiles = @(
                foreach ($directory in $logDirectories) {
                  if (Test-Path $directory) {
                    Get-ChildItem -LiteralPath $directory -Filter "run-*.log" -File -ErrorAction SilentlyContinue |
                      Where-Object { $_.LastWriteTime -ge $startedAt }
                  }
                }
              )
              $lastLog = $logFiles | Sort-Object LastWriteTime -Descending | Select-Object -First 1

              if (Test-Path $webUiLog) {
                $webUiContent = Get-Content -LiteralPath $webUiLog -Raw
                if ($webUiContent -match 'ERROR webui\.(javascript\.error|javascript\.unhandled_rejection|startup\.timeout|assets\.ready)') {
                  Write-Host "Detected WebUI startup or asset failure; collecting diagnostics."
                  break
                }
                if ($webUiContent -match 'INFO webui\.assets\.ready payload=.*"font_loaded":true.*"logo_loaded":true') {
                  $assetsReady = $true
                }
              }

              if ($lastLog) {
                $content = Get-Content -LiteralPath $lastLog.FullName -Raw
                if ($content -match 'event=webui\.javascript\.(error|unhandled_rejection)|event=webui\.startup\.timeout') {
                  Write-Host "Detected WebUI runtime failure; collecting diagnostics."
                  break
                }
                if ($content -match 'event=webui\.bridge\.ready') {
                  $uiReady = $true
                }
              }

              if ($uiReady -and $assetsReady) {
                Write-Host "Verified React mount, Winky Rough font, and Asteria logo in exported Windows build."
                if (Test-Path $webUiLog) { Write-Host (Get-Content -LiteralPath $webUiLog -Raw) }
                break
              }

              Start-Sleep -Seconds 1
            }

            if (-not $uiReady -or -not $assetsReady) {
              if ($lastLog) {
                Write-Host (Get-Content -LiteralPath $lastLog.FullName -Raw)
              }
              if (Test-Path $webUiLog) { Write-Host (Get-Content -LiteralPath $webUiLog -Raw) }
              if (Test-Path $stdoutPath) { Write-Host (Get-Content -LiteralPath $stdoutPath -Raw) }
              if (Test-Path $stderrPath) { Write-Host (Get-Content -LiteralPath $stderrPath -Raw) }
              throw "The exported WebUI did not verify React, Winky Rough, and the Asteria logo within 45 seconds."
            }
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              $process.WaitForExit()
            }
          }

      - name: Package Windows app under one directory
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $buildRoot = Join-Path $env:GITHUB_WORKSPACE "build"
          $appRoot = Join-Path $buildRoot "package/Asteria"
          $package = Join-Path $buildRoot "Asteria-Windows-x64.zip"
          $dataDirectory = Join-Path $buildRoot "data_Asteria_windows_x86_64"
          $runtimeDirectory = Join-Path $buildRoot "WebView2Runtime"

          Remove-Item (Split-Path $appRoot -Parent) -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $package -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $appRoot | Out-Null

          $requiredItems = @(
            (Join-Path $buildRoot "Asteria.exe"),
            $dataDirectory,
            $runtimeDirectory,
            (Join-Path $buildRoot "BUILD_INFO.txt")
          )
          foreach ($item in $requiredItems) {
            if (-not (Test-Path -LiteralPath $item)) {
              throw "Windows application package input is missing: $item"
            }
            Copy-Item -LiteralPath $item -Destination $appRoot -Recurse -Force
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          Compress-Archive -LiteralPath $appRoot -DestinationPath $package -CompressionLevel NoCompression -Force
          $archive = [System.IO.Compression.ZipFile]::OpenRead($package)
          try {
            $entries = @($archive.Entries)
            if ($entries.Count -eq 0 -or
                @($entries | Where-Object { -not $_.FullName.StartsWith("Asteria/") }).Count -gt 0) {
              throw "Windows ZIP must contain one top-level Asteria/ directory."
            }
          }
          finally {
            $archive.Dispose()
          }

          Write-Host "Packaged Windows application with a single top-level Asteria/ directory."

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Asteria-Windows-x64
          path: build/Asteria-Windows-x64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish public GitHub Release download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $shortSha = $env:GITHUB_SHA.Substring(0, 12)
          $tag = "windows-$shortSha"
          $title = "Asteria Windows x64 ($shortSha)"
          gh release create $tag "build/Asteria-Windows-x64.zip" `
            --repo $env:GITHUB_REPOSITORY `
            --title $title `
            --notes "Automated Windows x64 Release build from commit $env:GITHUB_SHA. Godot 4.7.2 .NET; ReadyToRun enabled; WebView2 Fixed Version 157.0.4341.42 bundled." `
            --prerelease
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish GitHub Release asset." }
