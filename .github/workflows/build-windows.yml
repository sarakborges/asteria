name: build-windows

on:
  push:
    branches:
      - worldgen-perf-fix
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    name: Export Windows x64 (Godot .NET + ReadyToRun)
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust for the patched Windows WebView extension
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Godot 4.7.2 .NET and Windows export templates
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "4.7.2-stable"
          $root = Join-Path $env:RUNNER_TEMP "asteria-godot"
          New-Item -ItemType Directory -Force $root | Out-Null

          $editorZip = Join-Path $root "godot-mono-win64.zip"
          $editorUrl = "https://github.com/godotengine/godot/releases/download/$version/Godot_v$($version)_mono_win64.zip"
          Invoke-WebRequest -Uri $editorUrl -OutFile $editorZip
          $editorHash = (Get-FileHash $editorZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($editorHash -ne "a2a48473a7414c5f19fab690518caebb738c09ef9601f6bd2388676a7f53b3c0") {
            throw "Godot editor archive SHA-256 mismatch: $editorHash"
          }

          $editorDir = Join-Path $root "editor"
          Expand-Archive -Path $editorZip -DestinationPath $editorDir -Force
          $godot = Get-ChildItem $editorDir -Recurse -File |
            Where-Object { $_.Name -eq "Godot_v4.7.2-stable_mono_win64_console.exe" } |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $godot) {
            throw "Godot 4.7.2 .NET console editor executable was not found."
          }

          $templatesZip = Join-Path $root "godot-mono-templates.tpz"
          $templatesUrl = "https://github.com/godotengine/godot/releases/download/$version/Godot_v$($version)_mono_export_templates.tpz"
          Invoke-WebRequest -Uri $templatesUrl -OutFile $templatesZip
          $templatesHash = (Get-FileHash $templatesZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($templatesHash -ne "92f8681e349ef1f90891b792da95e3b2b0bd1ed610b78018c58feb2d87e15a9d") {
            throw "Godot export templates SHA-256 mismatch: $templatesHash"
          }

          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($templatesZip)
          try {
            $versionEntry = $archive.Entries |
              Where-Object { $_.Name -eq "version.txt" } |
              Select-Object -First 1
            $templateVersion = "4.7.2.stable.mono"
            if ($versionEntry) {
              $reader = [System.IO.StreamReader]::new($versionEntry.Open())
              try { $archiveVersion = $reader.ReadToEnd().Trim() } finally { $reader.Dispose() }
              if ($archiveVersion -ne $templateVersion) {
                throw "Unexpected Godot template version: $archiveVersion"
              }
            }
            Write-Host "Installing Godot export templates for $templateVersion"

            $templateDir = Join-Path $env:APPDATA "Godot/export_templates/$templateVersion"
            New-Item -ItemType Directory -Force $templateDir | Out-Null
            $requiredTemplates = @(
              "windows_debug_x86_64.exe",
              "windows_debug_x86_64_console.exe",
              "windows_release_x86_64.exe",
              "windows_release_x86_64_console.exe"
            )
            foreach ($name in $requiredTemplates) {
              $entry = $archive.Entries |
                Where-Object { $_.Name -eq $name } |
                Select-Object -First 1
              if (-not $entry) { throw "Missing export template in archive: $name" }
              $destination = Join-Path $templateDir $name
              [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $destination, $true)
            }
          }
          finally {
            $archive.Dispose()
          }

          & $godot --headless --version
          if ($LASTEXITCODE -ne 0) { throw "Godot version check failed." }
          "GODOT_BIN=$godot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Godot WRY and build WebUI
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE/scripts/install-webui.ps1"
          if ($LASTEXITCODE -ne 0) { throw "WebUI setup failed." }

      - name: Build Godot WRY with explicit Fixed Version runtime selection
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE/scripts/build-godot-wry-windows.ps1"
          if ($LASTEXITCODE -ne 0) { throw "Patched Windows WebView extension build failed." }

      - name: Verify WebUI export inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dist = Join-Path $env:GITHUB_WORKSPACE "webui-dist"
          $index = Join-Path $dist "index.html"
          $manifest = Join-Path $dist "source-manifest.txt"

          foreach ($required in @($index, $manifest)) {
            if (-not (Test-Path $required -PathType Leaf)) {
              throw "Required WebUI export input is missing: $required"
            }
          }

          $assets = @(Get-ChildItem -LiteralPath $dist -File -Recurse |
            Where-Object { $_.Extension -in @(".js", ".css") })
          if ($assets.Count -lt 2) {
            throw "WebUI build did not produce its JavaScript and CSS bundles."
          }

          $javascript = @(Get-ChildItem -LiteralPath $dist -Filter "*.js" -File -Recurse)
          $stylesheets = @(Get-ChildItem -LiteralPath $dist -Filter "*.css" -File -Recurse)
          if ($javascript.Count -lt 1 -or $stylesheets.Count -lt 1) {
            throw "WebUI build must contain JavaScript and CSS bundles."
          }

          $javascriptContent = ($javascript | ForEach-Object { Get-Content -LiteralPath $_.FullName -Raw }) -join "`n"
          $stylesheetContent = ($stylesheets | ForEach-Object { Get-Content -LiteralPath $_.FullName -Raw }) -join "`n"
          if ($javascriptContent -notmatch 'data:image/svg\+xml') {
            throw "The Asteria SVG logo was not inlined into the WebUI JavaScript bundle."
          }
          if ($stylesheetContent -notmatch 'data:font/woff2;base64,') {
            throw "Winky Rough WOFF2 font data was not inlined into the WebUI stylesheet."
          }

          $externalAssets = @(Get-ChildItem -LiteralPath $dist -File -Recurse |
            Where-Object { $_.Extension -in @(".woff", ".woff2", ".ttf", ".otf", ".svg", ".png") })
          if ($externalAssets.Count -gt 0) {
            throw "WebUI emitted raw external presentation assets that Godot may import: $($externalAssets.FullName -join ', ')"
          }

          Write-Host "WebUI export input: $index"
          Write-Host "WebUI export input: $manifest"
          Write-Host "Verified inline Winky Rough and logo data in $($assets.Count) browser bundles."

      - name: Prepare shared Windows export preset
        shell: pwsh
        run: |
          Copy-Item `
            "$env:GITHUB_WORKSPACE/scripts/export-presets/windows-desktop.cfg" `
            "$env:GITHUB_WORKSPACE/export_presets.cfg" `
            -Force

      - name: Restore and build C# solution
        shell: pwsh
        run: |
          dotnet restore .\Asteria.sln
          if ($LASTEXITCODE -ne 0) { throw "dotnet restore failed." }

          dotnet build .\Asteria.sln --configuration ExportRelease --no-restore --nologo
          if ($LASTEXITCODE -ne 0) { throw "C# solution build failed." }

      - name: Import Godot resources and build editor solution
        shell: pwsh
        run: |
          $importOutput = & "$env:GODOT_BIN" --headless --path "$env:GITHUB_WORKSPACE" --editor --import --quit 2>&1
          $importExitCode = $LASTEXITCODE
          $importText = $importOutput -join "`n"
          $importOutput | ForEach-Object { Write-Host $_ }
          if ($importExitCode -ne 0) { throw "Godot resource import failed (exit code $importExitCode)." }
          if ($importText -match '(?im)SCRIPT ERROR:|Parse Error:|Failed to load script') {
            throw "Godot resource import reported a GDScript parse or script-load error."
          }

          $buildOutput = & "$env:GODOT_BIN" --headless --path "$env:GITHUB_WORKSPACE" --editor --build-solutions --quit 2>&1
          $buildExitCode = $LASTEXITCODE
          $buildText = $buildOutput -join "`n"
          $buildOutput | ForEach-Object { Write-Host $_ }
          if ($buildExitCode -ne 0) { throw "Godot C# solution build failed (exit code $buildExitCode)." }
          if ($buildText -match '(?im)SCRIPT ERROR:|Parse Error:|Failed to load script') {
            throw "Godot editor build reported a GDScript parse or script-load error."
          }

      - name: Export Windows x64 Release
        shell: pwsh
        run: |
          $buildRoot = Join-Path $env:GITHUB_WORKSPACE "build"
          $gameRoot = Join-Path $buildRoot "Game"
          $output = Join-Path $gameRoot "AsteriaGame.exe"
          New-Item -ItemType Directory -Force $gameRoot | Out-Null
          & "$env:GODOT_BIN" --headless --path "$env:GITHUB_WORKSPACE" --export-release "Windows Desktop" $output
          if ($LASTEXITCODE -ne 0) { throw "Godot Windows export failed." }
          if (-not (Test-Path $output -PathType Leaf)) { throw "Export command did not create $output." }
          $runtimePath = Join-Path $gameRoot "WebView2Runtime"
          & "$env:GITHUB_WORKSPACE/scripts/install-webview2-fixed.ps1" -DestinationPath $runtimePath
          if ($LASTEXITCODE -ne 0) { throw "WebView2 Fixed Version packaging failed." }
          $runtimeVersion = (Get-Content -LiteralPath (Join-Path $runtimePath "asteria-runtime-version.txt") -Raw).Trim()
          $buildInfo = @(
            "Asteria Windows x64 Release",
            "Commit: $env:GITHUB_SHA",
            "Godot: 4.7.2.stable.mono",
            "Target: win-x64",
            "ReadyToRun: enabled by Asteria.csproj",
            "WebView2 Fixed Version: $runtimeVersion",
            "Layout: Asteria.exe launcher + Game/AsteriaGame.exe",
            "Built: $([DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ'))"
          )
          $buildInfo | Set-Content (Join-Path $gameRoot "BUILD_INFO.txt") -Encoding utf8

      - name: Verify embedded built-in pack resources
        shell: pwsh
        run: |
          $assemblyPath = Join-Path $env:GITHUB_WORKSPACE "build/Game/data_Asteria_windows_x86_64/Asteria.dll"
          if (-not (Test-Path $assemblyPath -PathType Leaf)) {
            throw "Exported managed assembly not found: $assemblyPath"
          }

          $runtimeRoot = Join-Path $env:GITHUB_WORKSPACE "build/Game/WebView2Runtime"
          $runtimeBrowser = Join-Path $runtimeRoot "msedgewebview2.exe"
          $runtimeVersionFile = Join-Path $runtimeRoot "asteria-runtime-version.txt"
          if (-not (Test-Path $runtimeBrowser -PathType Leaf) -or
              -not (Test-Path $runtimeVersionFile -PathType Leaf)) {
            throw "Self-contained WebView2 Fixed Version runtime is missing from the Windows package."
          }
          $runtimeVersion = (Get-Content $runtimeVersionFile -Raw).Trim()
          if ($runtimeVersion -ne "157.0.4341.42") {
            throw "Unexpected WebView2 Fixed Version in package: $runtimeVersion"
          }
          Write-Host "Verified bundled WebView2 Fixed Version runtime: $runtimeVersion"

          $assembly = [System.Reflection.Assembly]::LoadFrom($assemblyPath)
          $resourcesByCanonicalName = @{}
          foreach ($manifestName in $assembly.GetManifestResourceNames()) {
            $canonicalName = $manifestName.Replace('\', '/')
            if ($resourcesByCanonicalName.ContainsKey($canonicalName)) {
              throw "Duplicate built-in resource after path normalization: $canonicalName"
            }
            $resourcesByCanonicalName[$canonicalName] = $manifestName
          }

          $required = @(
            "asteria.pack.default/ui/theme.json",
            "asteria.pack.default/data/blocks/stone.json",
            "asteria.pack.default/resources/textures/blocks/basalt.png"
          )
          foreach ($resource in $required) {
            if (-not $resourcesByCanonicalName.ContainsKey($resource)) {
              throw "Exported Asteria.dll is missing required built-in pack resource: $resource"
            }

            $manifestName = $resourcesByCanonicalName[$resource]
            $stream = $assembly.GetManifestResourceStream($manifestName)
            if ($null -eq $stream) {
              throw "Could not open exported built-in pack resource: $resource ($manifestName)"
            }

            try {
              if ($resource.EndsWith(".png", [StringComparison]::OrdinalIgnoreCase)) {
                $signature = New-Object byte[] 8
                $read = $stream.Read($signature, 0, $signature.Length)
                $expected = [byte[]](137, 80, 78, 71, 13, 10, 26, 10)
                if ($read -ne 8 -or
                    -not [System.Linq.Enumerable]::SequenceEqual([byte[]]$signature, $expected)) {
                  throw "Embedded texture is not a valid PNG resource: $resource"
                }
              }
            }
            finally {
              $stream.Dispose()
            }

            Write-Host "Verified readable embedded resource: $resource"
          }

      - name: Stage portable Windows application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $buildRoot = Join-Path $env:GITHUB_WORKSPACE "build"
          $gameSource = Join-Path $buildRoot "Game"
          $appRoot = Join-Path $buildRoot "package/Asteria"
          $launcherOutput = Join-Path $buildRoot "launcher-output"
          $launcherProject = Join-Path $env:GITHUB_WORKSPACE "tools/Asteria.Launcher/Asteria.Launcher.csproj"
          if (-not (Test-Path (Join-Path $gameSource "AsteriaGame.exe") -PathType Leaf)) { throw "Godot executable missing from Game/." }
          Remove-Item (Split-Path $appRoot -Parent) -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $launcherOutput -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $appRoot | Out-Null
          Copy-Item -LiteralPath $gameSource -Destination (Join-Path $appRoot "Game") -Recurse -Force
          dotnet publish $launcherProject --configuration Release --runtime win-x64 --self-contained true --output $launcherOutput --nologo
          if ($LASTEXITCODE -ne 0) { throw "Portable launcher publish failed." }
          $launcher = Join-Path $launcherOutput "Asteria.exe"
          if (-not (Test-Path $launcher -PathType Leaf)) { throw "Launcher output missing: $launcher" }
          Copy-Item -LiteralPath $launcher -Destination (Join-Path $appRoot "Asteria.exe")
          foreach ($name in @("mods", "logs", "worlds", "packs")) {
            $directory = Join-Path $appRoot $name
            New-Item -ItemType Directory -Force $directory | Out-Null
            Set-Content -LiteralPath (Join-Path $directory ".keep") -Value "Asteria portable $name directory." -Encoding utf8
          }
          @(
            "Asteria — Windows x64",
            "",
            "Run Asteria.exe.",
            "Game/ contains the game runtime and embedded resources.",
            "Install mods in mods/, external content packs in packs/,",
            "and find saved worlds in worlds/. Runtime logs are written to logs/.",
            "Keep Game/ beside Asteria.exe."
          ) | Set-Content (Join-Path $appRoot "README.txt") -Encoding utf8
          Write-Host "Staged portable root launcher and Game/ runtime."

      - name: Smoke-test portable launcher and WebView2 interface
        shell: pwsh
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = "Stop"
          $appRoot = Join-Path $env:GITHUB_WORKSPACE "build/package/Asteria"
          $executable = Join-Path $appRoot "Asteria.exe"
          $gameExecutable = Join-Path $appRoot "Game/AsteriaGame.exe"
          $logDirectory = Join-Path $appRoot "logs"
          $webUiLog = Join-Path $logDirectory "webui-startup.log"
          $stdoutPath = Join-Path $logDirectory "smoke-stdout.log"
          $stderrPath = Join-Path $logDirectory "smoke-stderr.log"
          $startedAt = Get-Date
          if (-not (Test-Path $executable -PathType Leaf) -or -not (Test-Path $gameExecutable -PathType Leaf)) { throw "Root launcher or nested game executable is missing." }
          if (Test-Path Env:ASTERIA_PORTABLE_ROOT) { Remove-Item Env:ASTERIA_PORTABLE_ROOT }
          if (Test-Path Env:WEBVIEW2_BROWSER_EXECUTABLE_FOLDER) { Remove-Item Env:WEBVIEW2_BROWSER_EXECUTABLE_FOLDER }
          $process = Start-Process -FilePath $executable -WorkingDirectory $appRoot -PassThru -RedirectStandardOutput $stdoutPath -RedirectStandardError $stderrPath
          $uiReady = $false
          $assetsReady = $false
          $lastLog = $null
          try {
            $deadline = (Get-Date).AddSeconds(45)
            while ((Get-Date) -lt $deadline) {
              if ($process.HasExited) { throw "Launcher exited before UI readiness (exit code $($process.ExitCode))." }
              $lastLog = Get-ChildItem -LiteralPath $logDirectory -Filter "run-*.log" -File -ErrorAction SilentlyContinue |
                Where-Object { $_.LastWriteTime -ge $startedAt } |
                Sort-Object LastWriteTime -Descending | Select-Object -First 1
              if ($lastLog) {
                $content = Get-Content -LiteralPath $lastLog.FullName -Raw
                if ($content -match 'event=webui\.(bundle\.missing|runtime\.fixed_missing|extension\.missing|startup\.timeout|javascript\.error|javascript\.unhandled_rejection)') {
                  Write-Host $content
                  throw "Portable WebUI startup emitted an error."
                }
                if ($content -match 'event=webui\.bridge\.ready') { $uiReady = $true }
                if ($content -match 'event=webui\.assets\.ready.*"font_loaded":true.*"logo_loaded":true') { $assetsReady = $true }
              }
              if ($uiReady -and $assetsReady) {
                Write-Host "Verified launcher, Game runtime, WebView2, React, Winky Rough and logo."
                if ($lastLog) { Write-Host (Get-Content -LiteralPath $lastLog.FullName -Raw) }
                if (Test-Path $webUiLog) { Write-Host (Get-Content -LiteralPath $webUiLog -Raw) }
                break
              }
              Start-Sleep -Seconds 1
            }
            if (-not $uiReady -or -not $assetsReady) {
              if ($lastLog) { Write-Host (Get-Content -LiteralPath $lastLog.FullName -Raw) }
              if (Test-Path $webUiLog) { Write-Host (Get-Content -LiteralPath $webUiLog -Raw) }
              if (Test-Path $stdoutPath) { Write-Host (Get-Content -LiteralPath $stdoutPath -Raw) }
              if (Test-Path $stderrPath) { Write-Host (Get-Content -LiteralPath $stderrPath -Raw) }
              throw "Portable launcher did not verify WebUI, font and logo within 45 seconds."
            }
          }
          finally {
            if (-not $process.HasExited) { $process.Kill($true); $process.WaitForExit() }
          }

      - name: Archive and validate portable Windows application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $buildRoot = Join-Path $env:GITHUB_WORKSPACE "build"
          $appRoot = Join-Path $buildRoot "package/Asteria"
          $package = Join-Path $buildRoot "Asteria-Windows-x64.zip"
          foreach ($path in @("Asteria.exe", "Game/AsteriaGame.exe", "Game/data_Asteria_windows_x86_64/Asteria.dll", "Game/WebView2Runtime/msedgewebview2.exe", "mods/.keep", "logs/.keep", "worlds/.keep", "packs/.keep")) {
            if (-not (Test-Path -LiteralPath (Join-Path $appRoot $path) -PathType Leaf)) { throw "Portable package item missing: $path" }
          }
          Remove-Item $package -Force -ErrorAction SilentlyContinue
          Compress-Archive -LiteralPath $appRoot -DestinationPath $package -CompressionLevel Optimal -Force
          $archive = [System.IO.Compression.ZipFile]::OpenRead($package)
          try {
            $entries = @($archive.Entries)
            $entryNames = $entries | ForEach-Object { $_.FullName.Replace('\', '/') }
            if ($entries.Count -eq 0 -or @($entryNames | Where-Object { -not $_.StartsWith("Asteria/") }).Count -gt 0) { throw "ZIP must contain exactly one top-level Asteria/ directory." }
            foreach ($required in @("Asteria/Asteria.exe", "Asteria/Game/AsteriaGame.exe", "Asteria/Game/data_Asteria_windows_x86_64/Asteria.dll", "Asteria/Game/WebView2Runtime/msedgewebview2.exe", "Asteria/mods/.keep", "Asteria/logs/.keep", "Asteria/worlds/.keep", "Asteria/packs/.keep")) {
              if ($required -notin $entryNames) { throw "ZIP is missing portable-layout item: $required" }
            }
            if (@($entryNames | Where-Object { $_ -match '^Asteria/Game/(mods|logs|worlds|packs)/' }).Count -gt 0) { throw "User data directories must remain beside root Asteria.exe." }
          }
          finally { $archive.Dispose() }
          Write-Host "Verified Asteria.exe + Game/ + mods/ + logs/ + worlds/ + packs/."

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Asteria-Windows-x64
          path: build/Asteria-Windows-x64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish public GitHub Release download
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $shortSha = $env:GITHUB_SHA.Substring(0, 12)
          $tag = "windows-$shortSha"
          $title = "Asteria Windows x64 ($shortSha)"
          gh release create $tag "build/Asteria-Windows-x64.zip" `
            --repo $env:GITHUB_REPOSITORY `
            --title $title `
            --notes "Portable Windows x64 build from commit $env:GITHUB_SHA. Root Asteria.exe launcher; game runtime in Game/; mods, logs, worlds and packs beside the launcher. Godot 4.7.2 .NET; ReadyToRun enabled; WebView2 Fixed Version bundled." `
            --prerelease
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish GitHub Release asset." }
