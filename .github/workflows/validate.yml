name: validate

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test performance log comparator
        run: python3 -m unittest discover -s tools/perf -p 'test_*.py'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Reject Godot metadata inside packs
        shell: bash
        run: |
          forbidden="$(
            find packs               \( -type f \(                 -name '*.import' -o                 -name '*.uid' -o                 -name '*.tres' -o                 -name '*.res' -o                 -name '*.tscn'               \) -o -type d -name '.godot' \)               -print
          )"
          if [ -n "$forbidden" ]; then
            printf 'Godot-specific metadata/resources are forbidden inside packs:\n%s\n' "$forbidden"
            exit 1
          fi

      - name: Build Godot C# project
        run: dotnet build Asteria.csproj --configuration Release

      - name: Verify game runtime single-tier JIT configuration
        shell: bash
        run: |
          set -euo pipefail
          runtime_config="$(find .godot/mono/temp/bin -type f \
            -name 'Asteria.runtimeconfig.json' -print -quit)"
          if [ -z "$runtime_config" ]; then
            echo "Asteria.runtimeconfig.json was not generated for the dynamic Godot assembly."
            exit 1
          fi
          python3 - "$runtime_config" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              config = json.load(stream)
          properties = config.get("runtimeOptions", {}).get("configProperties", {})
          key = "System.Runtime.TieredCompilation"
          if properties.get(key) is not False:
              raise SystemExit(
                  f"{key} must be false in {sys.argv[1]}, got {properties.get(key)!r}"
              )
          print(f"Verified {key}=false in {sys.argv[1]}")
          PY

      - name: Publish and verify ReadyToRun game assemblies
        shell: bash
        run: |
          set -euo pipefail
          publish_dir="$RUNNER_TEMP/asteria-r2r"
          dotnet publish Asteria.csproj \
            --configuration ExportRelease \
            --runtime linux-x64 \
            --self-contained false \
            -p:GodotTargetPlatform=Linux \
            --output "$publish_dir" \
            --nologo

          python3 - "$publish_dir" <<'PY'
          import pathlib
          import struct
          import sys

          root = pathlib.Path(sys.argv[1])
          assemblies = ("Asteria.dll", "Asteria.Core.dll", "Asteria.ModAPI.dll")

          def u16(data, offset):
              return struct.unpack_from("<H", data, offset)[0]

          def u32(data, offset):
              return struct.unpack_from("<I", data, offset)[0]

          def rva_to_offset(data, sections, rva):
              for offset in sections:
                  virtual_size = u32(data, offset + 8)
                  virtual_address = u32(data, offset + 12)
                  raw_size = u32(data, offset + 16)
                  raw_pointer = u32(data, offset + 20)
                  span = max(virtual_size, raw_size)
                  if virtual_address <= rva < virtual_address + span:
                      return raw_pointer + rva - virtual_address
              raise SystemExit(f"Could not map PE RVA 0x{rva:x} to a file offset.")

          for name in assemblies:
              path = root / name
              if not path.is_file():
                  raise SystemExit(f"Missing published assembly: {path}")

              data = path.read_bytes()
              pe_offset = u32(data, 0x3C)
              if data[pe_offset:pe_offset + 4] != b"PE\0\0":
                  raise SystemExit(f"{name} is not a valid PE image.")

              coff = pe_offset + 4
              section_count = u16(data, coff + 2)
              optional_size = u16(data, coff + 16)
              optional = coff + 20
              magic = u16(data, optional)
              if magic == 0x20B:
                  directories = optional + 112
              elif magic == 0x10B:
                  directories = optional + 96
              else:
                  raise SystemExit(f"{name} has an unsupported PE optional header.")

              cli_rva = u32(data, directories + 14 * 8)
              if cli_rva == 0:
                  raise SystemExit(f"{name} has no CLR header.")
              section_table = optional + optional_size
              sections = [
                  section_table + index * 40
                  for index in range(section_count)
              ]
              cli_offset = rva_to_offset(data, sections, cli_rva)

              # IMAGE_COR20_HEADER.ManagedNativeHeader points to the R2R header.
              native_header_rva = u32(data, cli_offset + 64)
              native_header_size = u32(data, cli_offset + 68)
              if native_header_rva == 0 or native_header_size == 0:
                  raise SystemExit(f"{name} was not published with a ReadyToRun header.")

              print(f"Verified ReadyToRun: {name}")
          PY

      - name: Test engine-agnostic core
        run: dotnet test src/Asteria.Core.Tests/Asteria.Core.Tests.csproj --configuration Release

      - name: Test directional palette diagnostics in Debug
        run: |
          dotnet test src/Asteria.Core.Tests/Asteria.Core.Tests.csproj --configuration Debug \
            --filter FullyQualifiedName~DirectionalPaletteDiagnosticsAreReproducibleForFixedSeedAndChunk

      - name: Build Godot C# Debug assembly for native script loading
        run: dotnet build Asteria.csproj --configuration Debug

      - name: Install Godot 4.7.2 .NET for native smoke
        shell: bash
        run: |
          set -euo pipefail
          version="4.7.2-stable"
          archive="$RUNNER_TEMP/godot-mono.zip"
          curl -fL --retry 3 --retry-delay 2 -o "$archive" \
            "https://github.com/godotengine/godot/releases/download/${version}/Godot_v${version}_mono_linux_x86_64.zip"
          echo "129f82db7bafd54ae14bb5bb284041c73860e8c7a009a3a026ca5e946cbff247  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/godot-mono"
          unzip -q "$archive" -d "$RUNNER_TEMP/godot-mono"
          godot="$(find "$RUNNER_TEMP/godot-mono" -type f -name 'Godot_v4.7.2-stable_mono_linux.x86_64' -print -quit)"
          test -n "$godot"
          chmod +x "$godot"
          echo "GODOT_BIN=$godot" >> "$GITHUB_ENV"
          "$godot" --version

      - name: Validate native Godot scene and shaders headlessly
        shell: bash
        run: |
          set -euo pipefail
          # Import selected-project resources without launching WRY. The
          # scene may only be instantiated, never added to the live tree.
          timeout 180s "$GODOT_BIN" --headless --path . --editor --import
          timeout 90s "$GODOT_BIN" --headless --path . \
            --script res://tests/godot/native_presentation_smoke.gd

      - name: Record bounded worldgen query baseline
        run: |
          dotnet run --project tools/WorldgenBenchmark --configuration Release -- \
            --seed 181960897289965 --dimension asteria:overworld \
            --samples 2 --area-size 4 --chunks 1 \
            --enforce-ci-budgets true \
            --output worldgen-benchmark.json

      - name: Profile fixed-seed directional face palettes
        run: |
          dotnet run --project tools/WorldgenBenchmark --configuration Debug -- \
            --seed 181960897289965 --dimension asteria:overworld \
            --samples 2 --area-size 4 --chunks 1 \
            --output worldgen-directional-face-palette-profile.json

      - name: Profile per-voxel, regional and regional-hybrid geology selection
        run: |
          dotnet run --project tools/WorldgenBenchmark --configuration Release -- \
            --seed 181960897289965 --dimension asteria:overworld \
            --samples 1 --area-size 1 --chunks 1 \
            --profile-geology-sampling true \
            --output worldgen-geology-sampling.json

      - name: Render fixed-seed biome map fixtures
        run: |
          dotnet run --project tools/BiomeMap --configuration Release -- \
            --seed 181960897289965 --dimension asteria:overworld \
            --width 64 --depth 64 --step 8 --mode influences \
            --output biome-map-overworld.svg
          dotnet run --project tools/BiomeMap --configuration Release -- \
            --seed 181960897289965 --dimension asteria:umbral \
            --width 64 --depth 64 --step 8 --mode influences \
            --output biome-map-umbral.svg

      - name: Render materialized 3D geology around the ocean regression seed
        run: |
          dotnet run --project tools/WorldgenBenchmark --configuration Release -- \
            --seed 7808508665006554090 --dimension asteria:overworld \
            --center-x 355 --center-z -230 --samples 1 --area-size 1 \
            --map-size 96 --map-step 4 --chunks 1 --search-radius 64 \
            --material-map-output biome-map-geology-ocean.svg

      - name: Render regional geology in ocean terrain
        run: |
          dotnet run --project tools/WorldgenBenchmark --configuration Release -- \
            --seed 7808508665006554090 --dimension asteria:overworld \
            --center-x 355 --center-z -230 --samples 1 --area-size 1 \
            --map-size 96 --map-step 4 --chunks 1 --search-radius 64 \
            --material-map-sampling-mode regional \
            --material-map-output biome-map-geology-ocean-regional.svg

      - name: Render per-voxel geology in ocean terrain
        run: |
          dotnet run --project tools/WorldgenBenchmark --configuration Release -- \
            --seed 7808508665006554090 --dimension asteria:overworld \
            --center-x 355 --center-z -230 --samples 1 --area-size 1 \
            --map-size 96 --map-step 4 --chunks 1 --search-radius 8192 \
            --material-map-biome asteria:overworld/ocean \
            --material-map-sampling-mode per-voxel \
            --material-map-output biome-map-geology-ocean-per-voxel.svg

      - name: Render materialized 3D geology on elevated mountain terrain
        run: |
          dotnet run --project tools/WorldgenBenchmark --configuration Release -- \
            --seed 7808508665006554090 --dimension asteria:overworld \
            --center-x 355 --center-z -230 --samples 1 --area-size 1 \
            --map-size 96 --map-step 4 --chunks 1 --search-radius 8192 \
            --material-map-biome asteria:overworld/mountains \
            --material-map-output biome-map-geology-mountains.svg

      - name: Render regional geology on elevated mountain terrain
        run: |
          dotnet run --project tools/WorldgenBenchmark --configuration Release -- \
            --seed 7808508665006554090 --dimension asteria:overworld \
            --center-x 355 --center-z -230 --samples 1 --area-size 1 \
            --map-size 96 --map-step 4 --chunks 1 --search-radius 8192 \
            --material-map-biome asteria:overworld/mountains \
            --material-map-sampling-mode regional \
            --material-map-output biome-map-geology-mountains-regional.svg

      - name: Render per-voxel geology on elevated mountain terrain
        run: |
          dotnet run --project tools/WorldgenBenchmark --configuration Release -- \
            --seed 7808508665006554090 --dimension asteria:overworld \
            --center-x 355 --center-z -230 --samples 1 --area-size 1 \
            --map-size 96 --map-step 4 --chunks 1 --search-radius 8192 \
            --material-map-biome asteria:overworld/mountains \
            --material-map-sampling-mode per-voxel \
            --material-map-output biome-map-geology-mountains-per-voxel.svg

      - name: Render authored and regional geology in swamp terrain
        run: |
          dotnet run --project tools/WorldgenBenchmark --configuration Release -- \
            --seed 7808508665006554090 --dimension asteria:overworld \
            --center-x 0 --center-z 0 --samples 1 --area-size 1 \
            --map-size 96 --map-step 4 --chunks 1 --search-radius 8192 \
            --material-map-biome asteria:overworld/swamp \
            --material-map-output biome-map-geology-swamp-authored.svg
          dotnet run --project tools/WorldgenBenchmark --configuration Release -- \
            --seed 7808508665006554090 --dimension asteria:overworld \
            --center-x 0 --center-z 0 --samples 1 --area-size 1 \
            --map-size 96 --map-step 4 --chunks 1 --search-radius 8192 \
            --material-map-biome asteria:overworld/swamp \
            --material-map-sampling-mode regional \
            --material-map-output biome-map-geology-swamp-regional.svg

      - name: Render regional-hybrid geology across representative biomes
        run: |
          for biome in plains swamp ocean mountains; do
            dotnet run --project tools/WorldgenBenchmark --configuration Release -- \
              --seed 7808508665006554090 --dimension asteria:overworld \
              --center-x 0 --center-z 0 --samples 1 --area-size 1 \
              --map-size 96 --map-step 4 --chunks 1 --search-radius 8192 \
              --material-map-biome "asteria:overworld/${biome}" \
              --material-map-sampling-mode regional-hybrid \
              --material-map-output "biome-map-geology-${biome}-regional-hybrid.svg"
          done

      - name: Upload worldgen query baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worldgen-query-baseline
          path: |
            worldgen-benchmark.json
            worldgen-directional-face-palette-profile.json
            worldgen-geology-sampling.json
          if-no-files-found: ignore

      - name: Upload biome map fixture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worldgen-biome-map
          path: biome-map-*.svg
          if-no-files-found: ignore

  terrain-ab:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pull request head and history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Resolve terrain A/B candidate and baseline
        id: terrain_scope
        shell: bash
        env:
          # Pre-feature baseline: last correct version before per-voxel
          # directional exposure metadata was introduced.
          BASELINE_SHA: f6affd92ddb1dcd109238c25f8ea40d1172bd872
        run: |
          set -euo pipefail
          changed_paths=(
            src/Asteria.Core/World/CaveSpikeField.cs
            src/Asteria.Core/World/SurfaceChunkMaterializer.cs
            src/Asteria.Core/World/Chunk.cs
            tools/WorldgenBenchmark/Program.cs
            src/Asteria.Core/World/WorldGenerationEntropy.cs
            src/Asteria.Core/World/SurfaceTerrainField.cs
            src/Asteria.Core/World/BiomeSurfaceMaterialField.cs
            src/Asteria.Core/World/BiomeField.cs
            src/Asteria.Core/World/BiomeWorldGenerator.cs
            src/Asteria.Core/World/VolumeStructureField.cs
            src/Asteria.Core/World/VolumeBiomeField.cs
          )
          baseline_commit="$BASELINE_SHA"
          git cat-file -e "${baseline_commit}^{commit}"
          if git diff --quiet "${baseline_commit}...HEAD" -- "${changed_paths[@]}"; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No terrain materialization changes found in the pull-request history."
            exit 0
          fi

          # Benchmark the exact PR head, not the last commit touching a worldgen
          # file. Diagnostic/interface fixes may land in a later commit and are
          # still required to build and measure that terrain implementation.
          candidate_commit="$(git rev-parse HEAD)"
          echo "candidate_commit=$candidate_commit" >> "$GITHUB_OUTPUT"
          echo "baseline_commit=$baseline_commit" >> "$GITHUB_OUTPUT"
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "A/B baseline: $baseline_commit"
          echo "A/B candidate (PR head): $candidate_commit"

      - name: Setup .NET
        if: steps.terrain_scope.outputs.run == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build baseline and candidate benchmark tools
        if: steps.terrain_scope.outputs.run == 'true'
        shell: bash
        env:
          BASELINE_SHA: ${{ steps.terrain_scope.outputs.baseline_commit }}
          CANDIDATE_SHA: ${{ steps.terrain_scope.outputs.candidate_commit }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/terrain-layer-ab"
          baseline="$root/baseline"
          candidate="$root/candidate"
          mkdir -p "$root"
          baseline_sha="$BASELINE_SHA"
          git worktree add --detach "$baseline" "$baseline_sha"
          git worktree add --detach "$candidate" "$CANDIDATE_SHA"

          # Overlay the identical route-harness sources on the baseline worktree.
          # Core and the ordinary worldgen benchmark remain at their own commits.
          mkdir -p "$baseline/tools/WorldStreamingBenchmark"
          cp -a "$candidate/tools/WorldStreamingBenchmark/." \
            "$baseline/tools/WorldStreamingBenchmark/"

          dotnet build "$baseline/tools/WorldStreamingBenchmark/WorldStreamingBenchmark.csproj" \
            --configuration Release --nologo
          dotnet build "$candidate/tools/WorldStreamingBenchmark/WorldStreamingBenchmark.csproj" \
            --configuration Release --nologo
          dotnet build "$baseline/tools/WorldgenBenchmark/WorldgenBenchmark.csproj" \
            --configuration Release --nologo
          dotnet build "$baseline/tools/WorldgenBenchmark/WorldgenBenchmark.csproj" \
            --configuration Debug --nologo
          echo "TERRAIN_AB_BASELINE_SHA=$baseline_sha" >> "$GITHUB_ENV"
          echo "Selected terrain A/B baseline: $baseline_sha"
          dotnet build "$candidate/tools/WorldgenBenchmark/WorldgenBenchmark.csproj" \
            --configuration Release --nologo
          dotnet build "$candidate/tools/WorldgenBenchmark/WorldgenBenchmark.csproj" \
            --configuration Debug --nologo

      - name: Run alternating fixed-seed terrain A/B benchmarks
        if: steps.terrain_scope.outputs.run == 'true'
        shell: bash
        env:
          BASELINE_SHA: ${{ env.TERRAIN_AB_BASELINE_SHA }}
          CANDIDATE_SHA: ${{ steps.terrain_scope.outputs.candidate_commit }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/terrain-layer-ab"
          mkdir -p "$root/results/baseline" "$root/results/candidate"

          run_benchmark() {
            local version="$1"
            local project_root="$2"
            local repetition="$3"
            local output="$root/results/$version/$repetition.json"
            local log="$root/results/$version/$repetition.log"
            # Match the game's Asteria.runtimeconfig.json for both revisions.
            # Compile each IL method once with full optimization on first use.
            if ! env DOTNET_TieredCompilation=0 dotnet run \
              --project "$project_root/tools/WorldgenBenchmark/WorldgenBenchmark.csproj" \
              --configuration Release --no-build -- \
              --project-root "$project_root" \
              --seed 181960897289965 --dimension asteria:overworld \
              --samples 2 --area-size 4 --chunks 1 \
              --output "$output" > "$log" 2>&1; then
              cat "$log"
              return 1
            fi

            local route_output="$root/route-results/$version/$repetition.json"
            if ! env DOTNET_TieredCompilation=0 dotnet run \
              --project "$project_root/tools/WorldStreamingBenchmark/WorldStreamingBenchmark.csproj" \
              --configuration Release --no-build -- \
              --project-root "$project_root" \
              --seed 181960897289965 --dimension asteria:overworld \
              --route-steps 8 --radius 4 \
              --output "$route_output" > "$log.route" 2>&1; then
              cat "$log.route"
              return 1
            fi

            python3 - "$output" "$route_output" <<'PY'
          import json
          import pathlib
          import sys

          benchmark_path = pathlib.Path(sys.argv[1])
          route_path = pathlib.Path(sys.argv[2])
          benchmark = json.loads(benchmark_path.read_text(encoding="utf-8"))
          route = json.loads(route_path.read_text(encoding="utf-8"))
          benchmark["streamingRouteDiagnostics"] = route["streamingRouteDiagnostics"]
          benchmark_path.write_text(
              json.dumps(benchmark, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          }

          baseline="$root/baseline"
          candidate="$root/candidate"
          for repetition in 1 2 3 4; do
            if [ "$((repetition % 2))" -eq 1 ]; then
              run_benchmark baseline "$baseline" "$repetition"
              run_benchmark candidate "$candidate" "$repetition"
            else
              run_benchmark candidate "$candidate" "$repetition"
              run_benchmark baseline "$baseline" "$repetition"
            fi
          done

          python3 tools/perf/compare_worldgen_ab.py \
            --baseline-dir "$root/results/baseline" \
            --candidate-dir "$root/results/candidate" \
            --repetitions 4 --expected-chunks 67 \
            --baseline-sha "$BASELINE_SHA" \
            --candidate-sha "$CANDIDATE_SHA" \
            --json-output "$root/results/summary.json" \
            --report-output "$root/results/report.md"
          
          mkdir -p "$root/results/profiles"
          run_debug_profile() {
            local version="$1"
            local project_root="$2"
            local output="$root/results/profiles/$version.json"
            local log="$root/results/profiles/$version.log"
            if ! dotnet run \
              --project "$project_root/tools/WorldgenBenchmark/WorldgenBenchmark.csproj" \
              --configuration Debug --no-build -- \
              --project-root "$project_root" \
              --seed 181960897289965 --dimension asteria:overworld \
              --samples 2 --area-size 4 --chunks 1 \
              --output "$output" > "$log" 2>&1; then
              cat "$log"
              return 1
            fi
          }
          run_debug_profile baseline "$baseline"
          run_debug_profile candidate "$candidate"

          # Separate dynamic PGO from tiered compilation, then compare both
          # with the same candidate, seed, region and four-process sample size.
          mkdir -p "$root/results/candidate-no-pgo" \
            "$root/results/candidate-tiered-quickjit-on" \
            "$root/results/candidate-tiered-quickjit-off"
          run_candidate_runtime_mode() {
            local mode="$1"
            local repetition="$2"
            local tiered="$3"
            local pgo="$4"
            local quick_jit="$5"
            local output="$root/results/$mode/$repetition.json"
            local log="$root/results/$mode/$repetition.log"
            if ! env DOTNET_TieredCompilation="$tiered" \
              DOTNET_TieredPGO="$pgo" DOTNET_TC_QuickJit="$quick_jit" dotnet run \
              --project "$candidate/tools/WorldgenBenchmark/WorldgenBenchmark.csproj" \
              --configuration Release --no-build -- \
              --project-root "$candidate" \
              --seed 181960897289965 --dimension asteria:overworld \
              --samples 2 --area-size 4 --chunks 1 \
              --output "$output" > "$log" 2>&1; then
              cat "$log"
              return 1
            fi
          }
          for repetition in 1 2 3 4; do
            run_candidate_runtime_mode candidate-no-pgo "$repetition" 1 0 1
            run_candidate_runtime_mode candidate-tiered-quickjit-on "$repetition" 1 1 1
            run_candidate_runtime_mode candidate-tiered-quickjit-off "$repetition" 1 1 0
          done

          python3 - "$root/results/candidate" \
            "$root/results/candidate-tiered-quickjit-on" \
            "$root/results/candidate-no-pgo" \
            "$root/results/candidate-tiered-quickjit-off" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob
          import json
          import statistics
          import sys

          def read(folder):
              paths = sorted(glob.glob(f"{folder}/*.json"))
              if len(paths) != 4:
                  raise SystemExit(f"Expected four runs in {folder}, got {len(paths)}")
              documents = []
              for path in paths:
                  with open(path, encoding="utf-8") as stream:
                      documents.append(json.load(stream))
              digest_sets = [
                  {name: metric["digest"] for name, metric in item["metrics"].items()}
                  for item in documents
              ]
              if any(digests != digest_sets[0] for digests in digest_sets[1:]):
                  raise SystemExit(f"Generated-result digests differ within {folder}")
              return documents

          production, tiered_quickjit_on, no_pgo, tiered_quickjit_off = map(read, sys.argv[1:])
          reference = {
              name: metric["digest"]
              for name, metric in production[0]["metrics"].items()
          }
          for mode, documents in (
              ("tiered-quickjit-on", tiered_quickjit_on),
              ("tiered-no-pgo", no_pgo),
              ("tiered-quickjit-off", tiered_quickjit_off),
          ):
              for document in documents:
                  actual = {
                      name: metric["digest"]
                      for name, metric in document["metrics"].items()
                  }
                  if actual != reference:
                      raise SystemExit(f"Generated-result digest mismatch in {mode}")

          stages = ("TerrainLayer", "DirectionalFacePalettes", "CaveSpikes")

          def median_value(documents, sample_index, field, stage=None):
              values = []
              for document in documents:
                  sample = document["initialAreaSynthesisTimingBreakdown"]["warmSamples"][sample_index]
                  if stage is None:
                      values.append(float(sample[field]))
                  else:
                      values.append(float(sample["materializationStageTimings"]
                                          .get(stage, {})
                                          .get("elapsedMilliseconds", 0)))
              return statistics.median(values)

          print("\n### Candidate warm-up: production runtime vs JIT/PGO alternatives\n")
          modes = (
              ("Production (tiering off)", production),
              ("Tiered (QuickJIT on)", tiered_quickjit_on),
              ("Tiered, PGO off", no_pgo),
              ("Tiered (QuickJIT off)", tiered_quickjit_off),
          )
          print("| Warm pass / mode | Materialization (ms) | " +
                " | ".join(stages) + " |")
          print("|---|---:|" + "---:|" * len(stages))
          for index in range(3):
              for label, documents in modes:
                  total = median_value(documents, index, "materializationMilliseconds")
                  stage_values = [
                      f"{median_value(documents, index, '', stage):.2f}"
                      for stage in stages
                  ]
                  print(f"| {index + 1} / {label} | {total:.2f} | " +
                        " | ".join(stage_values) + " |")
          cold = [
              (label, statistics.median(
                  document["initialAreaSynthesisTimingBreakdown"]["cold"]["materializationMilliseconds"]
                  for document in documents))
              for label, documents in modes
          ]
          print("\nCold materialization medians: " +
                "; ".join(f"{label} {value:.2f} ms" for label, value in cold))
          print("\nAll mode digests match.\n")
          PY
          
          python3 - "$root/results/profiles/baseline.json" "$root/results/profiles/candidate.json" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import sys
          
          def read(path):
              with open(path, encoding="utf-8") as stream:
                  document = json.load(stream)
              return document["initialAreaStageTimingDiagnostics"]["warm"][
                  "directionalFacePaletteProfile"
              ]
          
          baseline, candidate = map(read, sys.argv[1:])
          fields = (
              "densitySlabReadMilliseconds",
              "horizontalBoundaryReadMilliseconds",
              "occupancyRowAssemblyMilliseconds",
              "candidateMaskBuildMilliseconds",
              "horizontalBoundaryBatchCount",
              "horizontalBoundaryColumnCount",
          )
          print("\n### Directional-face preparation profile (Debug)\n")
          print("| Metric | Baseline | Candidate |")
          print("|---|---:|---:|")
          for field in fields:
              baseline_value = baseline.get(field, "not instrumented")
              candidate_value = candidate.get(field, "not instrumented")
              print(f"| {field} | {baseline_value} | {candidate_value} |")
          print()
          PY
          
          cat "$root/results/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Compare IL/JIT and ReadyToRun worldgen execution
        if: steps.terrain_scope.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/terrain-layer-ab"
          candidate="$root/candidate"
          publish="$root/r2r-publish"
          results="$root/results/r2r-comparison"
          mkdir -p "$results/il" "$results/r2r"

          # Publish the exact same Core/benchmark sources with ReadyToRun.
          dotnet publish "$candidate/tools/WorldgenBenchmark/WorldgenBenchmark.csproj" \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained false \
            -p:PublishReadyToRun=true \
            --output "$publish" \
            --nologo

          python3 - "$publish" <<'PY'
          import pathlib
          import struct
          import sys

          root = pathlib.Path(sys.argv[1])
          assemblies = ("WorldgenBenchmark.dll", "Asteria.Core.dll")

          def u16(data, offset):
              return struct.unpack_from("<H", data, offset)[0]

          def u32(data, offset):
              return struct.unpack_from("<I", data, offset)[0]

          def rva_to_offset(data, sections, rva):
              for offset in sections:
                  virtual_size = u32(data, offset + 8)
                  virtual_address = u32(data, offset + 12)
                  raw_size = u32(data, offset + 16)
                  raw_pointer = u32(data, offset + 20)
                  if virtual_address <= rva < virtual_address + max(virtual_size, raw_size):
                      return raw_pointer + rva - virtual_address
              raise SystemExit(f"Could not map PE RVA 0x{rva:x}.")

          for name in assemblies:
              path = root / name
              if not path.is_file():
                  raise SystemExit(f"Missing published assembly: {path}")
              data = path.read_bytes()
              pe = u32(data, 0x3C)
              if data[pe:pe + 4] != b"PE\0\0":
                  raise SystemExit(f"{name} is not a valid PE image.")
              coff = pe + 4
              count = u16(data, coff + 2)
              optional_size = u16(data, coff + 16)
              optional = coff + 20
              magic = u16(data, optional)
              directories = optional + (112 if magic == 0x20B else 96 if magic == 0x10B else 0)
              if directories == optional:
                  raise SystemExit(f"{name} has an unsupported PE optional header.")
              cli_rva = u32(data, directories + 14 * 8)
              table = optional + optional_size
              sections = [table + index * 40 for index in range(count)]
              cli = rva_to_offset(data, sections, cli_rva)
              native_rva = u32(data, cli + 64)
              native_size = u32(data, cli + 68)
              if native_rva == 0 or native_size == 0:
                  raise SystemExit(f"{name} has no ReadyToRun native header.")
              print(f"Verified ReadyToRun: {name}")
          PY

          run_il() {
            local repetition="$1"
            local output="$results/il/$repetition.json"
            local log="$results/il/$repetition.log"
            if ! env DOTNET_TieredCompilation=0 dotnet run \
              --project "$candidate/tools/WorldgenBenchmark/WorldgenBenchmark.csproj" \
              --configuration Release --no-build -- \
              --project-root "$candidate" \
              --seed 181960897289965 --dimension asteria:overworld \
              --samples 2 --area-size 4 --chunks 1 \
              --output "$output" > "$log" 2>&1; then
              cat "$log"
              return 1
            fi
          }

          run_r2r() {
            local repetition="$1"
            local output="$results/r2r/$repetition.json"
            local log="$results/r2r/$repetition.log"
            if ! env DOTNET_TieredCompilation=0 dotnet "$publish/WorldgenBenchmark.dll" \
              --project-root "$candidate" \
              --seed 181960897289965 --dimension asteria:overworld \
              --samples 2 --area-size 4 --chunks 1 \
              --output "$output" > "$log" 2>&1; then
              cat "$log"
              return 1
            fi
          }

          # Alternate execution order to reduce shared-runner drift.
          for repetition in 1 2 3 4; do
            if [ "$((repetition % 2))" -eq 1 ]; then
              run_il "$repetition"
              run_r2r "$repetition"
            else
              run_r2r "$repetition"
              run_il "$repetition"
            fi
          done

          python3 - "$results" "$candidate" "$publish" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import pathlib
          import statistics
          import sys

          results = pathlib.Path(sys.argv[1])
          il_dir = results / "il"
          r2r_dir = results / "r2r"

          def read_repetitions(directory):
              paths = sorted(directory.glob("*.json"))
              if len(paths) != 4:
                  raise SystemExit(f"Expected four repetitions in {directory}, got {len(paths)}")
              documents = [json.loads(path.read_text(encoding="utf-8")) for path in paths]
              identity = None
              digests = None
              for document in documents:
                  current = (
                      document["seed"], document["dimension"], document["dimensionSeed"],
                      tuple(document["center"]),
                      document["initialAreaDiagnostics"]["desiredChunkCount"],
                  )
                  actual_digests = {
                      name: metric["digest"]
                      for name, metric in sorted(document["metrics"].items())
                  }
                  if identity is None:
                      identity, digests = current, actual_digests
                  elif current != identity or actual_digests != digests:
                      raise SystemExit(f"Seed/region/digest mismatch in {directory}")
              return documents, identity, digests

          il, il_identity, il_digests = read_repetitions(il_dir)
          r2r, r2r_identity, r2r_digests = read_repetitions(r2r_dir)
          if il_identity != r2r_identity or il_digests != r2r_digests:
              raise SystemExit("IL/JIT and ReadyToRun generated different world results.")

          metrics = (
              ("Cold materialization", lambda d: d["initialAreaSynthesisTimingBreakdown"]["cold"]["materializationMilliseconds"]),
              ("Warm synthesis", lambda d: d["metrics"]["initialAreaSynthesis"]["warmMs"]),
              ("Warm region materialization", lambda d: d["initialAreaMaterializationDiagnostics"]["warm"]["totalMaterializeMs"]),
              ("TerrainLayer warm", lambda d: d["initialAreaStageTimingDiagnostics"]["warm"]["byStage"]["TerrainLayer"]["elapsedMs"]),
              ("SurfaceDecorations warm", lambda d: d["initialAreaStageTimingDiagnostics"]["warm"]["byStage"]["SurfaceDecorations"]["elapsedMs"]),
              ("CaveSpikes warm", lambda d: d["initialAreaStageTimingDiagnostics"]["warm"]["byStage"]["CaveSpikes"]["elapsedMs"]),
          )

          print("\n### IL/JIT vs ReadyToRun worldgen (4 processes per mode)\n")
          print("Seed 181960897289965, 67 chunks, DOTNET_TieredCompilation=0; generated digests are identical.\n")
          print("| Metric | IL + JIT (ms) | ReadyToRun (ms) | R2R delta |")
          print("|---|---:|---:|---:|")
          for label, getter in metrics:
              before = statistics.median(getter(d) for d in il)
              after = statistics.median(getter(d) for d in r2r)
              delta = 0 if before == 0 else (after - before) / before * 100
              print(f"| {label} | {before:.2f} | {after:.2f} | {delta:+.1f}% |")

          for name in ("WorldgenBenchmark.dll", "Asteria.Core.dll"):
              il_size = (pathlib.Path(sys.argv[2]) / "tools/WorldgenBenchmark/bin/Release/net8.0" / name).stat().st_size
              r2r_size = (pathlib.Path(sys.argv[3]) / name).stat().st_size
              increase = (r2r_size - il_size) / il_size * 100
              print(f"\n- {name}: IL {il_size / 1024:.1f} KiB; R2R {r2r_size / 1024:.1f} KiB ({increase:+.1f}%).")
          PY

      - name: Upload terrain A/B evidence
        if: always() && steps.terrain_scope.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: terrain-layer-ab
          path: ${{ runner.temp }}/terrain-layer-ab/results/
          if-no-files-found: ignore
  webui:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install WebUI dependencies
        working-directory: ui
        run: npm install --package-lock=false

      - name: Build WebUI
        working-directory: ui
        run: npm run build

      - name: Build WebUI Storybook
        working-directory: ui
        run: npm run build-storybook

      - name: Install Chromium for screen parity tests
        working-directory: ui
        run: npx playwright install --with-deps chromium

      - name: Test rendered screen parity
        working-directory: ui
        run: npm run test:screen-parity

      - name: Upload screen parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webui-screen-parity
          path: ui/test-results/
          if-no-files-found: ignore
