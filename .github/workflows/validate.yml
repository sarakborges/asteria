name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test performance log comparator
        run: python3 -m unittest discover -s tools/perf -p 'test_*.py'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Reject Godot metadata inside packs
        shell: bash
        run: |
          forbidden="$(
            find packs               \( -type f \(                 -name '*.import' -o                 -name '*.uid' -o                 -name '*.tres' -o                 -name '*.res' -o                 -name '*.tscn'               \) -o -type d -name '.godot' \)               -print
          )"
          if [ -n "$forbidden" ]; then
            printf 'Godot-specific metadata/resources are forbidden inside packs:\n%s\n' "$forbidden"
            exit 1
          fi

      - name: Build Godot C# project
        run: dotnet build Asteria.csproj --configuration Release

      - name: Test engine-agnostic core
        run: dotnet test src/Asteria.Core.Tests/Asteria.Core.Tests.csproj --configuration Release

      - name: Build Godot C# Debug assembly for native script loading
        run: dotnet build Asteria.csproj --configuration Debug

      - name: Install Godot 4.7.2 .NET for native smoke
        shell: bash
        run: |
          set -euo pipefail
          version="4.7.2-stable"
          archive="$RUNNER_TEMP/godot-mono.zip"
          curl -fL --retry 3 --retry-delay 2 -o "$archive" \
            "https://github.com/godotengine/godot/releases/download/${version}/Godot_v${version}_mono_linux_x86_64.zip"
          echo "129f82db7bafd54ae14bb5bb284041c73860e8c7a009a3a026ca5e946cbff247  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/godot-mono"
          unzip -q "$archive" -d "$RUNNER_TEMP/godot-mono"
          godot="$(find "$RUNNER_TEMP/godot-mono" -type f -name 'Godot_v4.7.2-stable_mono_linux.x86_64' -print -quit)"
          test -n "$godot"
          chmod +x "$godot"
          echo "GODOT_BIN=$godot" >> "$GITHUB_ENV"
          "$godot" --version

      - name: Validate native Godot scene and shaders headlessly
        shell: bash
        run: |
          set -euo pipefail
          # Import selected-project resources without launching WRY. The
          # scene may only be instantiated, never added to the live tree.
          timeout 180s "$GODOT_BIN" --headless --path . --editor --import
          timeout 90s "$GODOT_BIN" --headless --path . \
            --script res://tests/godot/native_presentation_smoke.gd

      - name: Record bounded worldgen query baseline
        run: |
          dotnet run --project tools/WorldgenBenchmark --configuration Release -- \
            --seed 181960897289965 --dimension asteria:overworld \
            --samples 2 --area-size 4 --chunks 1 \
            --enforce-ci-budgets true \
            --output worldgen-benchmark.json

      - name: Render fixed-seed biome map fixtures
        run: |
          dotnet run --project tools/BiomeMap --configuration Release -- \
            --seed 181960897289965 --dimension asteria:overworld \
            --width 64 --depth 64 --step 8 --mode influences \
            --output biome-map-overworld.svg
          dotnet run --project tools/BiomeMap --configuration Release -- \
            --seed 181960897289965 --dimension asteria:umbral \
            --width 64 --depth 64 --step 8 --mode influences \
            --output biome-map-umbral.svg

      - name: Render materialized 3D geology around the ocean regression seed
        run: |
          dotnet run --project tools/WorldgenBenchmark --configuration Release -- \
            --seed 7808508665006554090 --dimension asteria:overworld \
            --center-x 355 --center-z -230 --samples 1 --area-size 1 \
            --map-size 96 --map-step 4 --chunks 1 --search-radius 64 \
            --material-map-output biome-map-geology-ocean.svg

      - name: Render materialized 3D geology on elevated mountain terrain
        run: |
          dotnet run --project tools/WorldgenBenchmark --configuration Release -- \
            --seed 7808508665006554090 --dimension asteria:overworld \
            --center-x 355 --center-z -230 --samples 1 --area-size 1 \
            --map-size 96 --map-step 4 --chunks 1 --search-radius 8192 \
            --material-map-biome asteria:overworld/mountains \
            --material-map-output biome-map-geology-mountains.svg

      - name: Upload worldgen query baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worldgen-query-baseline
          path: worldgen-benchmark.json
          if-no-files-found: ignore

      - name: Upload biome map fixture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worldgen-biome-map
          path: biome-map-*.svg
          if-no-files-found: ignore

  webui:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install WebUI dependencies
        working-directory: ui
        run: npm install --package-lock=false

      - name: Build WebUI
        working-directory: ui
        run: npm run build

      - name: Build WebUI Storybook
        working-directory: ui
        run: npm run build-storybook

      - name: Install Chromium for screen parity tests
        working-directory: ui
        run: npx playwright install --with-deps chromium

      - name: Test rendered screen parity
        working-directory: ui
        run: npm run test:screen-parity

      - name: Upload screen parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webui-screen-parity
          path: ui/test-results/
          if-no-files-found: ignore
