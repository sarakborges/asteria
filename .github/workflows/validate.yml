name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build Godot C# project
        run: dotnet build Asteria.csproj --configuration Release

      - name: Test engine-agnostic core
        run: dotnet test src/Asteria.Core.Tests/Asteria.Core.Tests.csproj --configuration Release

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install WebUI dependencies
        working-directory: ui
        run: npm install --package-lock=false

      - name: Build WebUI
        working-directory: ui
        run: npm run build

      - name: Build WebUI Storybook
        working-directory: ui
        run: npm run build-storybook
