name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test performance log comparator
        run: python3 -m unittest discover -s tools/perf -p 'test_*.py'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Reject Godot metadata inside packs
        shell: bash
        run: |
          forbidden="$(
            find packs               \( -type f \(                 -name '*.import' -o                 -name '*.uid' -o                 -name '*.tres' -o                 -name '*.res' -o                 -name '*.tscn'               \) -o -type d -name '.godot' \)               -print
          )"
          if [ -n "$forbidden" ]; then
            printf 'Godot-specific metadata/resources are forbidden inside packs:\n%s\n' "$forbidden"
            exit 1
          fi

      - name: Build Godot C# project
        run: dotnet build Asteria.csproj --configuration Release

      - name: Test engine-agnostic core
        run: dotnet test src/Asteria.Core.Tests/Asteria.Core.Tests.csproj --configuration Release

      - name: Test directional palette diagnostics in Debug
        run: |
          dotnet test src/Asteria.Core.Tests/Asteria.Core.Tests.csproj --configuration Debug \
            --filter FullyQualifiedName~DirectionalPaletteDiagnosticsAreReproducibleForFixedSeedAndChunk

      - name: Build Godot C# Debug assembly for native script loading
        run: dotnet build Asteria.csproj --configuration Debug

      - name: Install Godot 4.7.2 .NET for native smoke
        shell: bash
        run: |
          set -euo pipefail
          version="4.7.2-stable"
          archive="$RUNNER_TEMP/godot-mono.zip"
          curl -fL --retry 3 --retry-delay 2 -o "$archive" \
            "https://github.com/godotengine/godot/releases/download/${version}/Godot_v${version}_mono_linux_x86_64.zip"
          echo "129f82db7bafd54ae14bb5bb284041c73860e8c7a009a3a026ca5e946cbff247  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/godot-mono"
          unzip -q "$archive" -d "$RUNNER_TEMP/godot-mono"
          godot="$(find "$RUNNER_TEMP/godot-mono" -type f -name 'Godot_v4.7.2-stable_mono_linux.x86_64' -print -quit)"
          test -n "$godot"
          chmod +x "$godot"
          echo "GODOT_BIN=$godot" >> "$GITHUB_ENV"
          "$godot" --version

      - name: Validate native Godot scene and shaders headlessly
        shell: bash
        run: |
          set -euo pipefail
          # Import selected-project resources without launching WRY. The
          # scene may only be instantiated, never added to the live tree.
          timeout 180s "$GODOT_BIN" --headless --path . --editor --import
          timeout 90s "$GODOT_BIN" --headless --path . \
            --script res://tests/godot/native_presentation_smoke.gd

      - name: Record bounded worldgen query baseline
        run: |
          dotnet run --project tools/WorldgenBenchmark --configuration Release -- \
            --seed 181960897289965 --dimension asteria:overworld \
            --samples 2 --area-size 4 --chunks 1 \
            --enforce-ci-budgets true \
            --output worldgen-benchmark.json

      - name: Profile fixed-seed directional face palettes
        run: |
          dotnet run --project tools/WorldgenBenchmark --configuration Debug -- \
            --seed 181960897289965 --dimension asteria:overworld \
            --samples 2 --area-size 4 --chunks 1 \
            --output worldgen-directional-face-palette-profile.json

      - name: Render fixed-seed biome map fixtures
        run: |
          dotnet run --project tools/BiomeMap --configuration Release -- \
            --seed 181960897289965 --dimension asteria:overworld \
            --width 64 --depth 64 --step 8 --mode influences \
            --output biome-map-overworld.svg
          dotnet run --project tools/BiomeMap --configuration Release -- \
            --seed 181960897289965 --dimension asteria:umbral \
            --width 64 --depth 64 --step 8 --mode influences \
            --output biome-map-umbral.svg

      - name: Render materialized 3D geology around the ocean regression seed
        run: |
          dotnet run --project tools/WorldgenBenchmark --configuration Release -- \
            --seed 7808508665006554090 --dimension asteria:overworld \
            --center-x 355 --center-z -230 --samples 1 --area-size 1 \
            --map-size 96 --map-step 4 --chunks 1 --search-radius 64 \
            --material-map-output biome-map-geology-ocean.svg

      - name: Render materialized 3D geology on elevated mountain terrain
        run: |
          dotnet run --project tools/WorldgenBenchmark --configuration Release -- \
            --seed 7808508665006554090 --dimension asteria:overworld \
            --center-x 355 --center-z -230 --samples 1 --area-size 1 \
            --map-size 96 --map-step 4 --chunks 1 --search-radius 8192 \
            --material-map-biome asteria:overworld/mountains \
            --material-map-output biome-map-geology-mountains.svg

      - name: Render weighted-cellular geology benchmark and regression maps
        run: |
          dotnet run --project tools/WorldgenBenchmark --configuration Release -- \
            --seed 181960897289965 --dimension asteria:overworld \
            --samples 2 --area-size 4 --chunks 1 \
            --geology-algorithm cellular \
            --output worldgen-geology-cellular.json
          dotnet run --project tools/WorldgenBenchmark --configuration Release -- \
            --seed 7808508665006554090 --dimension asteria:overworld \
            --center-x 355 --center-z -230 --samples 1 --area-size 1 \
            --map-size 96 --map-step 4 --chunks 1 --search-radius 64 \
            --geology-algorithm cellular \
            --material-map-output biome-map-geology-ocean-cellular.svg
          dotnet run --project tools/WorldgenBenchmark --configuration Release -- \
            --seed 7808508665006554090 --dimension asteria:overworld \
            --center-x 355 --center-z -230 --samples 1 --area-size 1 \
            --map-size 96 --map-step 4 --chunks 1 --search-radius 8192 \
            --geology-algorithm cellular \
            --material-map-biome asteria:overworld/mountains \
            --material-map-output biome-map-geology-mountains-cellular.svg

      - name: Upload worldgen query baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worldgen-query-baseline
          path: |
            worldgen-benchmark.json
            worldgen-directional-face-palette-profile.json
            worldgen-geology-cellular.json
          if-no-files-found: ignore

      - name: Upload biome map fixture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worldgen-biome-map
          path: biome-map-*.svg
          if-no-files-found: ignore

  cellular-cache-ab:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pull request head and history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build pre-cache and cached cellular benchmark tools
        shell: bash
        env:
          BASELINE_SHA: c25b2aa3e031e074e46372d3f62fd55e2c7b99fb
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/cellular-cache-ab"
          baseline="$root/baseline"
          candidate="$root/candidate"
          mkdir -p "$root/results"
          git worktree add --detach "$baseline" "$BASELINE_SHA"
          git worktree add --detach "$candidate" "$CANDIDATE_SHA"
          dotnet build "$baseline/tools/WorldgenBenchmark/WorldgenBenchmark.csproj" --configuration Release --nologo
          dotnet build "$candidate/tools/WorldgenBenchmark/WorldgenBenchmark.csproj" --configuration Release --nologo
          echo "CELLULAR_CACHE_BASELINE_SHA=$BASELINE_SHA" >> "$GITHUB_ENV"
          echo "CELLULAR_CACHE_CANDIDATE_SHA=$CANDIDATE_SHA" >> "$GITHUB_ENV"

      - name: Run alternating pre-cache and cached cellular benchmarks
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/cellular-cache-ab"
          run_benchmark() {
            local version="$1"
            local project_root="$2"
            local repetition="$3"
            local output="$root/results/$version-$repetition.json"
            local log="$root/results/$version-$repetition.log"

            if ! dotnet run \
              --project "$project_root/tools/WorldgenBenchmark/WorldgenBenchmark.csproj" \
              --configuration Release --no-build -- \
              --project-root "$project_root" \
              --seed 181960897289965 --dimension asteria:overworld \
              --samples 2 --area-size 4 --chunks 1 \
              --geology-algorithm cellular \
              --output "$output" > "$log" 2>&1; then
              cat "$log"
              return 1
            fi
          }

          baseline="$root/baseline"
          candidate="$root/candidate"
          for repetition in 1 2 3 4; do
            if [ "$((repetition % 2))" -eq 1 ]; then
              run_benchmark precache "$baseline" "$repetition"
              run_benchmark cached "$candidate" "$repetition"
            else
              run_benchmark cached "$candidate" "$repetition"
              run_benchmark precache "$baseline" "$repetition"
            fi
          done

      - name: Compare cache impact and require identical generated output
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/cellular-cache-ab"
          python3 - "$root/results" "$root/report.md" "$root/summary.json" <<'PY'
          import json
          import pathlib
          import statistics
          import sys

          results_dir = pathlib.Path(sys.argv[1])
          report_path = pathlib.Path(sys.argv[2])
          summary_path = pathlib.Path(sys.argv[3])
          versions = ("precache", "cached")
          metrics = ("chunkSynthesis", "initialAreaSynthesis")
          repetitions = 4
          runs = {
              version: [
                  json.loads((results_dir / f"{version}-{rep}.json").read_text())
                  for rep in range(1, repetitions + 1)
              ]
              for version in versions
          }

          for metric_name in metrics:
              digests = {
                  version: {
                      run["metrics"][metric_name]["digest"]
                      for run in runs[version]
                  }
                  for version in versions
              }
              for version in versions:
                  if len(digests[version]) != 1:
                      raise SystemExit(
                          f"{version}/{metric_name} changed digest across repetitions: {sorted(digests[version])}"
                      )
              if digests["precache"] != digests["cached"]:
                  raise SystemExit(
                      f"Cached cellular site hashes changed generated output for {metric_name}: "
                      f"{digests['precache']} != {digests['cached']}"
                  )

          summary = {
              "seed": 181960897289965,
              "dimension": "asteria:overworld",
              "algorithm": "WeightedCellular",
              "repetitions": repetitions,
              "expectedInitialAreaChunks": 67,
              "baselineSha": "${{ env.CELLULAR_CACHE_BASELINE_SHA }}",
              "candidateSha": "${{ env.CELLULAR_CACHE_CANDIDATE_SHA }}",
              "metrics": {},
          }
          lines = [
              "# Weighted-cellular site-hash cache A/B",
              "",
              "Both versions use the same WeightedCellular algorithm. The candidate adds bounded reuse of raw site hashes through the existing per-materialization lattice cache.",
              "Fixed seed 181960897289965, Overworld, four independent Release processes per version, alternating execution order.",
              "Each process measures one cold and three warm passes; medians are across the four processes.",
              "The workflow fails if any digest differs across repetitions or between pre-cache and cached versions.",
              "",
              "| Metric | Pre-cache | Cached | Time change | Allocation change |",
              "|---|---:|---:|---:|---:|",
          ]

          for metric_name in metrics:
              summary["metrics"][metric_name] = {}
              for version in versions:
                  rows = [run["metrics"][metric_name] for run in runs[version]]
                  summary["metrics"][metric_name][version] = {
                      "coldMsMedian": statistics.median(row["coldMs"] for row in rows),
                      "warmMsMedian": statistics.median(row["warmMs"] for row in rows),
                      "coldAllocatedBytesMedian": int(statistics.median(row["coldAllocatedBytes"] for row in rows)),
                      "warmAllocatedBytesMedian": int(statistics.median(row["warmAllocatedBytes"] for row in rows)),
                      "digest": rows[0]["digest"],
                  }

              before = summary["metrics"][metric_name]["precache"]
              after = summary["metrics"][metric_name]["cached"]
              warm_time = (after["warmMsMedian"] / before["warmMsMedian"] - 1) * 100
              cold_time = (after["coldMsMedian"] / before["coldMsMedian"] - 1) * 100
              warm_alloc = (after["warmAllocatedBytesMedian"] / before["warmAllocatedBytesMedian"] - 1) * 100
              summary["metrics"][metric_name]["changesPercent"] = {
                  "warmTime": warm_time,
                  "coldTime": cold_time,
                  "warmAllocation": warm_alloc,
              }
              lines.append(
                  f"| {metric_name} | {before['warmMsMedian']:.2f} ms | "
                  f"{after['warmMsMedian']:.2f} ms | {warm_time:+.2f}% | {warm_alloc:+.2f}% |"
              )

          report = "\n".join(lines) + "\n"
          report_path.write_text(report)
          summary_path.write_text(json.dumps(summary, indent=2) + "\n")
          print(report)
          PY
          cat "$root/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload cellular cache A/B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cellular-cache-ab
          path: |
            ${{ runner.temp }}/cellular-cache-ab/results/
            ${{ runner.temp }}/cellular-cache-ab/report.md
            ${{ runner.temp }}/cellular-cache-ab/summary.json
          if-no-files-found: ignore

  geology-model-ab:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build worldgen benchmark
        run: dotnet build tools/WorldgenBenchmark/WorldgenBenchmark.csproj --configuration Release --nologo

      - name: Run alternating noise-field and weighted-cellular benchmarks
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/geology-model-ab"
          mkdir -p "$root/results"

          run_benchmark() {
            local algorithm="$1"
            local repetition="$2"
            local output="$root/results/$algorithm-$repetition.json"
            local log="$root/results/$algorithm-$repetition.log"

            if ! dotnet run \
              --project tools/WorldgenBenchmark/WorldgenBenchmark.csproj \
              --configuration Release --no-build -- \
              --seed 181960897289965 --dimension asteria:overworld \
              --samples 2 --area-size 4 --chunks 1 \
              --geology-algorithm "$algorithm" \
              --output "$output" > "$log" 2>&1; then
              cat "$log"
              return 1
            fi
          }

          for repetition in 1 2 3 4; do
            if [ "$((repetition % 2))" -eq 1 ]; then
              run_benchmark fields "$repetition"
              run_benchmark cellular "$repetition"
            else
              run_benchmark cellular "$repetition"
              run_benchmark fields "$repetition"
            fi
          done

      - name: Compare independent repetitions and verify determinism
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/geology-model-ab"
          python3 - "$root/results" "$root/report.md" "$root/summary.json" <<'PY'
          import json
          import pathlib
          import statistics
          import sys

          results_dir = pathlib.Path(sys.argv[1])
          report_path = pathlib.Path(sys.argv[2])
          summary_path = pathlib.Path(sys.argv[3])
          algorithms = ("fields", "cellular")
          metrics = ("chunkSynthesis", "initialAreaSynthesis")
          repetitions = 4

          runs = {
              algorithm: [
                  json.loads((results_dir / f"{algorithm}-{rep}.json").read_text())
                  for rep in range(1, repetitions + 1)
              ]
              for algorithm in algorithms
          }

          def metric_rows(algorithm, metric_name):
              return [run["metrics"][metric_name] for run in runs[algorithm]]

          for algorithm in algorithms:
              for metric_name in metrics:
                  rows = metric_rows(algorithm, metric_name)
                  digests = {row["digest"] for row in rows}
                  if len(digests) != 1:
                      raise SystemExit(
                          f"{algorithm}/{metric_name} is not deterministic across repetitions: {sorted(digests)}"
                      )

          summary = {
              "seed": 181960897289965,
              "dimension": "asteria:overworld",
              "repetitions": repetitions,
              "expectedInitialAreaChunks": 67,
              "metrics": {},
              "determinism": {
                  algorithm: {
                      metric_name: metric_rows(algorithm, metric_name)[0]["digest"]
                      for metric_name in metrics
                  }
                  for algorithm in algorithms
              },
          }

          lines = [
              "# Weighted-cellular vs noise-field geology",
              "",
              "Fixed seed 181960897289965, Overworld, four independent Release processes per algorithm.",
              "Execution order alternates between algorithms to reduce runner-order bias.",
              "Each process measures one cold and three warm passes; the table reports medians across independent processes.",
              "Digests are checked for repeatability within each algorithm. Different algorithms are expected to generate different digests.",
              "",
              "| Metric | Algorithm | Cold median | Warm median | Cold allocation median | Warm allocation median |",
              "|---|---|---:|---:|---:|---:|",
          ]

          fields_values = {}
          for metric_name in metrics:
              summary["metrics"][metric_name] = {}
              for algorithm in algorithms:
                  rows = metric_rows(algorithm, metric_name)
                  values = {
                      "coldMsMedian": statistics.median(row["coldMs"] for row in rows),
                      "warmMsMedian": statistics.median(row["warmMs"] for row in rows),
                      "coldAllocatedBytesMedian": int(statistics.median(row["coldAllocatedBytes"] for row in rows)),
                      "warmAllocatedBytesMedian": int(statistics.median(row["warmAllocatedBytes"] for row in rows)),
                      "operations": rows[0]["operations"],
                      "digest": rows[0]["digest"],
                  }
                  summary["metrics"][metric_name][algorithm] = values
                  lines.append(
                      f"| {metric_name} | {algorithm} | "
                      f"{values['coldMsMedian']:.2f} ms | {values['warmMsMedian']:.2f} ms | "
                      f"{values['coldAllocatedBytesMedian']:,} B | {values['warmAllocatedBytesMedian']:,} B |"
                  )

              field = summary["metrics"][metric_name]["fields"]
              cellular = summary["metrics"][metric_name]["cellular"]
              fields_values[metric_name] = {
                  "coldMsPercentChange": (cellular["coldMsMedian"] / field["coldMsMedian"] - 1) * 100
                      if field["coldMsMedian"] else None,
                  "warmMsPercentChange": (cellular["warmMsMedian"] / field["warmMsMedian"] - 1) * 100
                      if field["warmMsMedian"] else None,
                  "coldAllocatedBytesPercentChange": (
                      cellular["coldAllocatedBytesMedian"] / field["coldAllocatedBytesMedian"] - 1
                  ) * 100 if field["coldAllocatedBytesMedian"] else None,
                  "warmAllocatedBytesPercentChange": (
                      cellular["warmAllocatedBytesMedian"] / field["warmAllocatedBytesMedian"] - 1
                  ) * 100 if field["warmAllocatedBytesMedian"] else None,
              }

          summary["cellularVsFieldsPercentChange"] = fields_values
          lines.extend(["", "## Cellular vs fields", ""])
          for metric_name, changes in fields_values.items():
              lines.append(f"### {metric_name}")
              lines.append("")
              lines.append(
                  f"- Warm time: {changes['warmMsPercentChange']:+.2f}% "
                  "(negative means cellular is faster)."
              )
              lines.append(
                  f"- Cold time: {changes['coldMsPercentChange']:+.2f}%."
              )
              lines.append(
                  f"- Warm allocation: {changes['warmAllocatedBytesPercentChange']:+.2f}%."
              )
              lines.append(
                  f"- Cold allocation: {changes['coldAllocatedBytesPercentChange']:+.2f}%."
              )
              lines.append("")

          report = "\n".join(lines) + "\n"
          report_path.write_text(report)
          summary_path.write_text(json.dumps(summary, indent=2) + "\n")
          print(report)
          PY
          cat "$root/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload geology-model A/B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geology-model-ab
          path: |
            ${{ runner.temp }}/geology-model-ab/results/
            ${{ runner.temp }}/geology-model-ab/report.md
            ${{ runner.temp }}/geology-model-ab/summary.json
          if-no-files-found: ignore

  terrain-ab:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pull request head and history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Resolve the latest terrain-materialization change
        id: terrain_scope
        shell: bash
        run: |
          set -euo pipefail
          terrain_commit="$(git log --first-parent -1 --format=%H HEAD -- \
            src/Asteria.Core/World/CaveSpikeField.cs \
            src/Asteria.Core/World/SurfaceChunkMaterializer.cs \
            src/Asteria.Core/World/WorldGenerationEntropy.cs \
            src/Asteria.Core/World/SurfaceTerrainField.cs \
            src/Asteria.Core/World/BiomeSurfaceMaterialField.cs \
            src/Asteria.Core/World/BiomeField.cs \
            src/Asteria.Core/World/BiomeWorldGenerator.cs)"
          if [ -z "$terrain_commit" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No terrain materialization changes found in the pull-request history."
            exit 0
          fi

          baseline_commit="$(git rev-parse "${terrain_commit}^")"
          echo "terrain_commit=$terrain_commit" >> "$GITHUB_OUTPUT"
          echo "baseline_commit=$baseline_commit" >> "$GITHUB_OUTPUT"
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "A/B baseline: $baseline_commit"
          echo "A/B candidate: $terrain_commit"

      - name: Setup .NET
        if: steps.terrain_scope.outputs.run == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build baseline and candidate benchmark tools
        if: steps.terrain_scope.outputs.run == 'true'
        shell: bash
        env:
          BASELINE_SHA: ${{ steps.terrain_scope.outputs.baseline_commit }}
          CANDIDATE_SHA: ${{ steps.terrain_scope.outputs.terrain_commit }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/terrain-layer-ab"
          baseline="$root/baseline"
          candidate="$root/candidate"
          mkdir -p "$root"
          baseline_sha="$BASELINE_SHA"
          git worktree add --detach "$baseline" "$baseline_sha"
          git worktree add --detach "$candidate" "$CANDIDATE_SHA"

          # A short sequence of commits can leave an intermediate parent
          # intentionally incomplete. Walk back until the baseline benchmark
          # project builds, keeping the selected SHA for the comparison report.
          attempt=0
          while ! dotnet build "$baseline/tools/WorldgenBenchmark/WorldgenBenchmark.csproj" \
            --configuration Release --nologo; do
            if [ "$attempt" -ge 4 ]; then
              echo "Unable to find a buildable terrain A/B baseline."
              exit 1
            fi
            git worktree remove --force "$baseline"
            baseline_sha="$(git rev-parse "${baseline_sha}^")"
            echo "Retrying terrain A/B baseline at $baseline_sha"
            git worktree add --detach "$baseline" "$baseline_sha"
            attempt=$((attempt + 1))
          done

          echo "TERRAIN_AB_BASELINE_SHA=$baseline_sha" >> "$GITHUB_ENV"
          echo "Selected terrain A/B baseline: $baseline_sha"
          dotnet build "$candidate/tools/WorldgenBenchmark/WorldgenBenchmark.csproj" \
            --configuration Release --nologo

      - name: Run alternating fixed-seed terrain A/B benchmarks
        if: steps.terrain_scope.outputs.run == 'true'
        shell: bash
        env:
          BASELINE_SHA: ${{ env.TERRAIN_AB_BASELINE_SHA }}
          CANDIDATE_SHA: ${{ steps.terrain_scope.outputs.terrain_commit }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/terrain-layer-ab"
          mkdir -p "$root/results/baseline" "$root/results/candidate"

          run_benchmark() {
            local version="$1"
            local project_root="$2"
            local repetition="$3"
            local output="$root/results/$version/$repetition.json"
            local log="$root/results/$version/$repetition.log"
            if ! dotnet run \
              --project "$project_root/tools/WorldgenBenchmark/WorldgenBenchmark.csproj" \
              --configuration Release --no-build -- \
              --project-root "$project_root" \
              --seed 181960897289965 --dimension asteria:overworld \
              --samples 2 --area-size 4 --chunks 1 \
              --output "$output" > "$log" 2>&1; then
              cat "$log"
              return 1
            fi
          }

          baseline="$root/baseline"
          candidate="$root/candidate"
          for repetition in 1 2 3 4; do
            if [ "$((repetition % 2))" -eq 1 ]; then
              run_benchmark baseline "$baseline" "$repetition"
              run_benchmark candidate "$candidate" "$repetition"
            else
              run_benchmark candidate "$candidate" "$repetition"
              run_benchmark baseline "$baseline" "$repetition"
            fi
          done

          python3 tools/perf/compare_worldgen_ab.py \
            --baseline-dir "$root/results/baseline" \
            --candidate-dir "$root/results/candidate" \
            --repetitions 4 --expected-chunks 67 \
            --baseline-sha "$BASELINE_SHA" \
            --candidate-sha "$CANDIDATE_SHA" \
            --json-output "$root/results/summary.json" \
            --report-output "$root/results/report.md"
          cat "$root/results/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload terrain A/B evidence
        if: always() && steps.terrain_scope.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: terrain-layer-ab
          path: ${{ runner.temp }}/terrain-layer-ab/results/
          if-no-files-found: ignore
  webui:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install WebUI dependencies
        working-directory: ui
        run: npm install --package-lock=false

      - name: Build WebUI
        working-directory: ui
        run: npm run build

      - name: Build WebUI Storybook
        working-directory: ui
        run: npm run build-storybook

      - name: Install Chromium for screen parity tests
        working-directory: ui
        run: npx playwright install --with-deps chromium

      - name: Test rendered screen parity
        working-directory: ui
        run: npm run test:screen-parity

      - name: Upload screen parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webui-screen-parity
          path: ui/test-results/
          if-no-files-found: ignore
