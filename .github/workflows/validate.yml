name: validate

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test performance log comparator
        run: python3 -m unittest discover -s tools/perf -p 'test_*.py'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Reject Godot metadata inside packs
        shell: bash
        run: |
          forbidden="$(
            find packs               \( -type f \(                 -name '*.import' -o                 -name '*.uid' -o                 -name '*.tres' -o                 -name '*.res' -o                 -name '*.tscn'               \) -o -type d -name '.godot' \)               -print
          )"
          if [ -n "$forbidden" ]; then
            printf 'Godot-specific metadata/resources are forbidden inside packs:\n%s\n' "$forbidden"
            exit 1
          fi

      - name: Build Godot C# project
        run: dotnet build Asteria.csproj --configuration Release

      - name: Test engine-agnostic core
        run: dotnet test src/Asteria.Core.Tests/Asteria.Core.Tests.csproj --configuration Release

      - name: Test directional palette diagnostics in Debug
        run: |
          dotnet test src/Asteria.Core.Tests/Asteria.Core.Tests.csproj --configuration Debug \
            --filter FullyQualifiedName~DirectionalPaletteDiagnosticsAreReproducibleForFixedSeedAndChunk

      - name: Build Godot C# Debug assembly for native script loading
        run: dotnet build Asteria.csproj --configuration Debug

      - name: Install Godot 4.7.2 .NET for native smoke
        shell: bash
        run: |
          set -euo pipefail
          version="4.7.2-stable"
          archive="$RUNNER_TEMP/godot-mono.zip"
          curl -fL --retry 3 --retry-delay 2 -o "$archive" \
            "https://github.com/godotengine/godot/releases/download/${version}/Godot_v${version}_mono_linux_x86_64.zip"
          echo "129f82db7bafd54ae14bb5bb284041c73860e8c7a009a3a026ca5e946cbff247  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/godot-mono"
          unzip -q "$archive" -d "$RUNNER_TEMP/godot-mono"
          godot="$(find "$RUNNER_TEMP/godot-mono" -type f -name 'Godot_v4.7.2-stable_mono_linux.x86_64' -print -quit)"
          test -n "$godot"
          chmod +x "$godot"
          echo "GODOT_BIN=$godot" >> "$GITHUB_ENV"
          "$godot" --version

      - name: Validate native Godot scene and shaders headlessly
        shell: bash
        run: |
          set -euo pipefail
          # Import selected-project resources without launching WRY. The
          # scene may only be instantiated, never added to the live tree.
          timeout 180s "$GODOT_BIN" --headless --path . --editor --import
          timeout 90s "$GODOT_BIN" --headless --path . \
            --script res://tests/godot/native_presentation_smoke.gd

      - name: Record bounded worldgen query baseline
        run: |
          dotnet run --project tools/WorldgenBenchmark --configuration Release -- \
            --seed 181960897289965 --dimension asteria:overworld \
            --samples 2 --area-size 4 --chunks 1 \
            --enforce-ci-budgets true \
            --output worldgen-benchmark.json

      - name: Profile fixed-seed directional face palettes
        run: |
          dotnet run --project tools/WorldgenBenchmark --configuration Debug -- \
            --seed 181960897289965 --dimension asteria:overworld \
            --samples 2 --area-size 4 --chunks 1 \
            --output worldgen-directional-face-palette-profile.json

      - name: Profile per-voxel, regional and regional-hybrid geology selection
        run: |
          dotnet run --project tools/WorldgenBenchmark --configuration Release -- \
            --seed 181960897289965 --dimension asteria:overworld \
            --samples 1 --area-size 1 --chunks 1 \
            --profile-geology-sampling true \
            --output worldgen-geology-sampling.json

      - name: Render fixed-seed biome map fixtures
        run: |
          dotnet run --project tools/BiomeMap --configuration Release -- \
            --seed 181960897289965 --dimension asteria:overworld \
            --width 64 --depth 64 --step 8 --mode influences \
            --output biome-map-overworld.svg
          dotnet run --project tools/BiomeMap --configuration Release -- \
            --seed 181960897289965 --dimension asteria:umbral \
            --width 64 --depth 64 --step 8 --mode influences \
            --output biome-map-umbral.svg

      - name: Render materialized 3D geology around the ocean regression seed
        run: |
          dotnet run --project tools/WorldgenBenchmark --configuration Release -- \
            --seed 7808508665006554090 --dimension asteria:overworld \
            --center-x 355 --center-z -230 --samples 1 --area-size 1 \
            --map-size 96 --map-step 4 --chunks 1 --search-radius 64 \
            --material-map-output biome-map-geology-ocean.svg

      - name: Render regional geology in ocean terrain
        run: |
          dotnet run --project tools/WorldgenBenchmark --configuration Release -- \
            --seed 7808508665006554090 --dimension asteria:overworld \
            --center-x 355 --center-z -230 --samples 1 --area-size 1 \
            --map-size 96 --map-step 4 --chunks 1 --search-radius 64 \
            --material-map-sampling-mode regional \
            --material-map-output biome-map-geology-ocean-regional.svg

      - name: Render per-voxel geology in ocean terrain
        run: |
          dotnet run --project tools/WorldgenBenchmark --configuration Release -- \
            --seed 7808508665006554090 --dimension asteria:overworld \
            --center-x 355 --center-z -230 --samples 1 --area-size 1 \
            --map-size 96 --map-step 4 --chunks 1 --search-radius 8192 \
            --material-map-biome asteria:overworld/ocean \
            --material-map-sampling-mode per-voxel \
            --material-map-output biome-map-geology-ocean-per-voxel.svg

      - name: Render materialized 3D geology on elevated mountain terrain
        run: |
          dotnet run --project tools/WorldgenBenchmark --configuration Release -- \
            --seed 7808508665006554090 --dimension asteria:overworld \
            --center-x 355 --center-z -230 --samples 1 --area-size 1 \
            --map-size 96 --map-step 4 --chunks 1 --search-radius 8192 \
            --material-map-biome asteria:overworld/mountains \
            --material-map-output biome-map-geology-mountains.svg

      - name: Render regional geology on elevated mountain terrain
        run: |
          dotnet run --project tools/WorldgenBenchmark --configuration Release -- \
            --seed 7808508665006554090 --dimension asteria:overworld \
            --center-x 355 --center-z -230 --samples 1 --area-size 1 \
            --map-size 96 --map-step 4 --chunks 1 --search-radius 8192 \
            --material-map-biome asteria:overworld/mountains \
            --material-map-sampling-mode regional \
            --material-map-output biome-map-geology-mountains-regional.svg

      - name: Render per-voxel geology on elevated mountain terrain
        run: |
          dotnet run --project tools/WorldgenBenchmark --configuration Release -- \
            --seed 7808508665006554090 --dimension asteria:overworld \
            --center-x 355 --center-z -230 --samples 1 --area-size 1 \
            --map-size 96 --map-step 4 --chunks 1 --search-radius 8192 \
            --material-map-biome asteria:overworld/mountains \
            --material-map-sampling-mode per-voxel \
            --material-map-output biome-map-geology-mountains-per-voxel.svg

      - name: Render authored and regional geology in swamp terrain
        run: |
          dotnet run --project tools/WorldgenBenchmark --configuration Release -- \
            --seed 7808508665006554090 --dimension asteria:overworld \
            --center-x 0 --center-z 0 --samples 1 --area-size 1 \
            --map-size 96 --map-step 4 --chunks 1 --search-radius 8192 \
            --material-map-biome asteria:overworld/swamp \
            --material-map-output biome-map-geology-swamp-authored.svg
          dotnet run --project tools/WorldgenBenchmark --configuration Release -- \
            --seed 7808508665006554090 --dimension asteria:overworld \
            --center-x 0 --center-z 0 --samples 1 --area-size 1 \
            --map-size 96 --map-step 4 --chunks 1 --search-radius 8192 \
            --material-map-biome asteria:overworld/swamp \
            --material-map-sampling-mode regional \
            --material-map-output biome-map-geology-swamp-regional.svg

      - name: Render regional-hybrid geology across representative biomes
        run: |
          for biome in plains swamp ocean mountains; do
            dotnet run --project tools/WorldgenBenchmark --configuration Release -- \
              --seed 7808508665006554090 --dimension asteria:overworld \
              --center-x 0 --center-z 0 --samples 1 --area-size 1 \
              --map-size 96 --map-step 4 --chunks 1 --search-radius 8192 \
              --material-map-biome "asteria:overworld/${biome}" \
              --material-map-sampling-mode regional-hybrid \
              --material-map-output "biome-map-geology-${biome}-regional-hybrid.svg"
          done

      - name: Upload worldgen query baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worldgen-query-baseline
          path: |
            worldgen-benchmark.json
            worldgen-directional-face-palette-profile.json
            worldgen-geology-sampling.json
          if-no-files-found: ignore

      - name: Upload biome map fixture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worldgen-biome-map
          path: biome-map-*.svg
          if-no-files-found: ignore

  terrain-ab:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pull request head and history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Resolve terrain A/B candidate and baseline
        id: terrain_scope
        shell: bash
        env:
          # Pre-feature baseline: last correct version before per-voxel
          # directional exposure metadata was introduced.
          BASELINE_SHA: f6affd92ddb1dcd109238c25f8ea40d1172bd872
        run: |
          set -euo pipefail
          changed_paths=(
            src/Asteria.Core/World/CaveSpikeField.cs
            src/Asteria.Core/World/SurfaceChunkMaterializer.cs
            src/Asteria.Core/World/Chunk.cs
            tools/WorldgenBenchmark/Program.cs
            src/Asteria.Core/World/WorldGenerationEntropy.cs
            src/Asteria.Core/World/SurfaceTerrainField.cs
            src/Asteria.Core/World/BiomeSurfaceMaterialField.cs
            src/Asteria.Core/World/BiomeField.cs
            src/Asteria.Core/World/BiomeWorldGenerator.cs
            src/Asteria.Core/World/VolumeStructureField.cs
            src/Asteria.Core/World/VolumeBiomeField.cs
          )
          baseline_commit="$BASELINE_SHA"
          git cat-file -e "${baseline_commit}^{commit}"
          if git diff --quiet "${baseline_commit}...HEAD" -- "${changed_paths[@]}"; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No terrain materialization changes found in the pull-request history."
            exit 0
          fi

          # Benchmark the exact PR head, not the last commit touching a worldgen
          # file. Diagnostic/interface fixes may land in a later commit and are
          # still required to build and measure that terrain implementation.
          candidate_commit="$(git rev-parse HEAD)"
          echo "candidate_commit=$candidate_commit" >> "$GITHUB_OUTPUT"
          echo "baseline_commit=$baseline_commit" >> "$GITHUB_OUTPUT"
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "A/B baseline: $baseline_commit"
          echo "A/B candidate (PR head): $candidate_commit"

      - name: Setup .NET
        if: steps.terrain_scope.outputs.run == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build baseline and candidate benchmark tools
        if: steps.terrain_scope.outputs.run == 'true'
        shell: bash
        env:
          BASELINE_SHA: ${{ steps.terrain_scope.outputs.baseline_commit }}
          CANDIDATE_SHA: ${{ steps.terrain_scope.outputs.candidate_commit }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/terrain-layer-ab"
          baseline="$root/baseline"
          candidate="$root/candidate"
          mkdir -p "$root"
          baseline_sha="$BASELINE_SHA"
          git worktree add --detach "$baseline" "$baseline_sha"
          git worktree add --detach "$candidate" "$CANDIDATE_SHA"
          dotnet build "$baseline/tools/WorldgenBenchmark/WorldgenBenchmark.csproj" \
            --configuration Release --nologo
          dotnet build "$baseline/tools/WorldgenBenchmark/WorldgenBenchmark.csproj" \
            --configuration Debug --nologo
          echo "TERRAIN_AB_BASELINE_SHA=$baseline_sha" >> "$GITHUB_ENV"
          echo "Selected terrain A/B baseline: $baseline_sha"
          dotnet build "$candidate/tools/WorldgenBenchmark/WorldgenBenchmark.csproj" \
            --configuration Release --nologo
          dotnet build "$candidate/tools/WorldgenBenchmark/WorldgenBenchmark.csproj" \
            --configuration Debug --nologo

      - name: Run alternating fixed-seed terrain A/B benchmarks
        if: steps.terrain_scope.outputs.run == 'true'
        shell: bash
        env:
          BASELINE_SHA: ${{ env.TERRAIN_AB_BASELINE_SHA }}
          CANDIDATE_SHA: ${{ steps.terrain_scope.outputs.candidate_commit }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/terrain-layer-ab"
          mkdir -p "$root/results/baseline" "$root/results/candidate"

          run_benchmark() {
            local version="$1"
            local project_root="$2"
            local repetition="$3"
            local output="$root/results/$version/$repetition.json"
            local log="$root/results/$version/$repetition.log"
            if ! dotnet run \
              --project "$project_root/tools/WorldgenBenchmark/WorldgenBenchmark.csproj" \
              --configuration Release --no-build -- \
              --project-root "$project_root" \
              --seed 181960897289965 --dimension asteria:overworld \
              --samples 2 --area-size 4 --chunks 1 \
              --output "$output" > "$log" 2>&1; then
              cat "$log"
              return 1
            fi
          }

          baseline="$root/baseline"
          candidate="$root/candidate"
          for repetition in 1 2 3 4; do
            if [ "$((repetition % 2))" -eq 1 ]; then
              run_benchmark baseline "$baseline" "$repetition"
              run_benchmark candidate "$candidate" "$repetition"
            else
              run_benchmark candidate "$candidate" "$repetition"
              run_benchmark baseline "$baseline" "$repetition"
            fi
          done

          python3 tools/perf/compare_worldgen_ab.py \
            --baseline-dir "$root/results/baseline" \
            --candidate-dir "$root/results/candidate" \
            --repetitions 4 --expected-chunks 67 \
            --baseline-sha "$BASELINE_SHA" \
            --candidate-sha "$CANDIDATE_SHA" \
            --json-output "$root/results/summary.json" \
            --report-output "$root/results/report.md"
          
          mkdir -p "$root/results/profiles"
          run_debug_profile() {
            local version="$1"
            local project_root="$2"
            local output="$root/results/profiles/$version.json"
            local log="$root/results/profiles/$version.log"
            if ! dotnet run \
              --project "$project_root/tools/WorldgenBenchmark/WorldgenBenchmark.csproj" \
              --configuration Debug --no-build -- \
              --project-root "$project_root" \
              --seed 181960897289965 --dimension asteria:overworld \
              --samples 2 --area-size 4 --chunks 1 \
              --output "$output" > "$log" 2>&1; then
              cat "$log"
              return 1
            fi
          }
          run_debug_profile baseline "$baseline"
          run_debug_profile candidate "$candidate"

          # Separate dynamic PGO from tiered compilation, then compare both
          # with the same candidate, seed, region and four-process sample size.
          mkdir -p "$root/results/candidate-no-pgo" \
            "$root/results/candidate-no-tiering" \
            "$root/results/candidate-no-quickjit"
          run_candidate_runtime_mode() {
            local mode="$1"
            local repetition="$2"
            local tiered="$3"
            local pgo="$4"
            local quick_jit="$5"
            local output="$root/results/$mode/$repetition.json"
            local log="$root/results/$mode/$repetition.log"
            if ! env DOTNET_TieredCompilation="$tiered" \
              DOTNET_TieredPGO="$pgo" DOTNET_TC_QuickJit="$quick_jit" dotnet run \
              --project "$candidate/tools/WorldgenBenchmark/WorldgenBenchmark.csproj" \
              --configuration Release --no-build -- \
              --project-root "$candidate" \
              --seed 181960897289965 --dimension asteria:overworld \
              --samples 2 --area-size 4 --chunks 1 \
              --output "$output" > "$log" 2>&1; then
              cat "$log"
              return 1
            fi
          }
          for repetition in 1 2 3 4; do
            run_candidate_runtime_mode candidate-no-pgo "$repetition" 1 0 1
            run_candidate_runtime_mode candidate-no-quickjit "$repetition" 1 1 0
            run_candidate_runtime_mode candidate-no-tiering "$repetition" 0 0 1
          done

          python3 - "$root/results/candidate" \
            "$root/results/candidate-no-pgo" \
            "$root/results/candidate-no-quickjit" \
            "$root/results/candidate-no-tiering" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob
          import json
          import statistics
          import sys

          def read(folder):
              paths = sorted(glob.glob(f"{folder}/*.json"))
              if len(paths) != 4:
                  raise SystemExit(f"Expected four runs in {folder}, got {len(paths)}")
              documents = []
              for path in paths:
                  with open(path, encoding="utf-8") as stream:
                      documents.append(json.load(stream))
              digest_sets = [
                  {name: metric["digest"] for name, metric in item["metrics"].items()}
                  for item in documents
              ]
              if any(digests != digest_sets[0] for digests in digest_sets[1:]):
                  raise SystemExit(f"Generated-result digests differ within {folder}")
              return documents

          default, no_pgo, no_quickjit, no_tiering = map(read, sys.argv[1:])
          reference = {
              name: metric["digest"]
              for name, metric in default[0]["metrics"].items()
          }
          for mode, documents in (
              ("tiered-no-pgo", no_pgo),
              ("tiered-no-quickjit", no_quickjit),
              ("no-tiering", no_tiering),
          ):
              for document in documents:
                  actual = {
                      name: metric["digest"]
                      for name, metric in document["metrics"].items()
                  }
                  if actual != reference:
                      raise SystemExit(f"Generated-result digest mismatch in {mode}")

          stages = ("TerrainLayer", "DirectionalFacePalettes", "CaveSpikes")

          def median_value(documents, sample_index, field, stage=None):
              values = []
              for document in documents:
                  sample = document["initialAreaSynthesisTimingBreakdown"]["warmSamples"][sample_index]
                  if stage is None:
                      values.append(float(sample[field]))
                  else:
                      values.append(float(sample["materializationStageTimings"]
                                          .get(stage, {})
                                          .get("elapsedMilliseconds", 0)))
              return statistics.median(values)

          print("\n### Candidate warm-up: .NET tiering and dynamic PGO isolation\n")
          modes = (
              ("Default", default),
              ("Tiered, PGO off", no_pgo),
              ("Tiered, QuickJIT off", no_quickjit),
              ("Tiering off", no_tiering),
          )
          print("| Warm pass / mode | Materialization (ms) | " +
                " | ".join(stages) + " |")
          print("|---|---:|" + "---:|" * len(stages))
          for index in range(3):
              for label, documents in modes:
                  total = median_value(documents, index, "materializationMilliseconds")
                  stage_values = [
                      f"{median_value(documents, index, '', stage):.2f}"
                      for stage in stages
                  ]
                  print(f"| {index + 1} / {label} | {total:.2f} | " +
                        " | ".join(stage_values) + " |")
          cold = [
              (label, statistics.median(
                  document["initialAreaSynthesisTimingBreakdown"]["cold"]["materializationMilliseconds"]
                  for document in documents))
              for label, documents in modes
          ]
          print("\nCold materialization medians: " +
                "; ".join(f"{label} {value:.2f} ms" for label, value in cold))
          print("\nAll mode digests match.\n")
          PY
          
          python3 - "$root/results/profiles/baseline.json" "$root/results/profiles/candidate.json" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import sys
          
          def read(path):
              with open(path, encoding="utf-8") as stream:
                  document = json.load(stream)
              return document["initialAreaStageTimingDiagnostics"]["warm"][
                  "directionalFacePaletteProfile"
              ]
          
          baseline, candidate = map(read, sys.argv[1:])
          fields = (
              "densitySlabReadMilliseconds",
              "horizontalBoundaryReadMilliseconds",
              "occupancyRowAssemblyMilliseconds",
              "candidateMaskBuildMilliseconds",
              "horizontalBoundaryBatchCount",
              "horizontalBoundaryColumnCount",
          )
          print("\n### Directional-face preparation profile (Debug)\n")
          print("| Metric | Baseline | Candidate |")
          print("|---|---:|---:|")
          for field in fields:
              baseline_value = baseline.get(field, "not instrumented")
              candidate_value = candidate.get(field, "not instrumented")
              print(f"| {field} | {baseline_value} | {candidate_value} |")
          print()
          PY
          
          cat "$root/results/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload terrain A/B evidence
        if: always() && steps.terrain_scope.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: terrain-layer-ab
          path: ${{ runner.temp }}/terrain-layer-ab/results/
          if-no-files-found: ignore
  webui:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install WebUI dependencies
        working-directory: ui
        run: npm install --package-lock=false

      - name: Build WebUI
        working-directory: ui
        run: npm run build

      - name: Build WebUI Storybook
        working-directory: ui
        run: npm run build-storybook

      - name: Install Chromium for screen parity tests
        working-directory: ui
        run: npx playwright install --with-deps chromium

      - name: Test rendered screen parity
        working-directory: ui
        run: npm run test:screen-parity

      - name: Upload screen parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webui-screen-parity
          path: ui/test-results/
          if-no-files-found: ignore
